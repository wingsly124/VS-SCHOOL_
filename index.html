<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vs School · SMK MERBAU</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b1220;--panel:rgba(30,41,59,.72);--panel2:#1e293b;
  --line:rgba(56,189,248,.18);--text:#f0f9ff;--muted:#94a3b8;--dim:#64748b;
  --primary:#0ea5e9;--primary2:#10b981;--accent:#06b6d4;
  --ok:#10b981;--warn:#f59e0b;--danger:#ef4444;
}
body.light{
  --bg:#f0f9ff;--panel:rgba(255,255,255,.92);--panel2:#ffffff;
  --line:rgba(14,165,233,.2);--text:#0c4a6e;--muted:#64748b;--dim:#94a3b8;
}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:15px;min-height:100vh;transition:background .3s,color .3s}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;transition:opacity .3s;
  background:
    radial-gradient(900px 700px at 15% -10%,rgba(14,165,233,.22),transparent 60%),
    radial-gradient(700px 500px at 100% 10%,rgba(16,185,129,.15),transparent 55%),
    radial-gradient(600px 500px at 50% 100%,rgba(6,182,212,.12),transparent 60%),
    linear-gradient(160deg,#0b1220,#0f172a 55%,#0b1220)}
body.light::before{opacity:.4}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
.screen{display:none;min-height:100vh}.screen.active{display:block}

/* Splash */
#scr-splash{display:none;place-items:center;min-height:100vh;text-align:center;overflow:hidden}
#scr-splash.active{display:grid}
.splash-orbs{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5}
.orb.a{width:340px;height:340px;background:#0ea5e9;top:-100px;left:-100px;animation:float1 9s ease-in-out infinite}
.orb.b{width:280px;height:280px;background:#10b981;bottom:-80px;right:-80px;animation:float2 11s ease-in-out infinite}
.orb.c{width:220px;height:220px;background:#06b6d4;top:40%;left:60%;animation:float1 13s ease-in-out infinite reverse}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,80px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,-80px)}}
.splash-inner{position:relative;z-index:2}
.vs-logo{width:140px;height:140px;margin:0 auto;display:block;animation:logoFloat 3.5s ease-in-out infinite}
@keyframes logoFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-14px) scale(1.05)}
}
.splash-title{font-size:46px;font-weight:800;letter-spacing:-1.5px;margin:18px 0 0;
  background:linear-gradient(120deg,#fff,#7dd3fc 40%,#10b981 70%,#06b6d4);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:fadeUp .8s .3s backwards}
.splash-sub{font-size:12px;letter-spacing:6px;color:#38bdf8;margin-top:6px;font-weight:700;animation:fadeUp .8s .5s backwards}
.splash-slogan{font-size:18px;color:#7dd3fc;margin-top:16px;font-weight:600;animation:fadeUp .8s .7s backwards}
body.light .splash-slogan{color:#0284c7}
.splash-school{font-size:11px;letter-spacing:3px;color:var(--muted);margin-top:26px;padding:7px 18px;
  border:1px solid var(--line);border-radius:99px;display:inline-block;animation:fadeUp .8s .9s backwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.splash-progress{width:260px;height:5px;background:rgba(14,165,233,.15);border-radius:99px;overflow:hidden;margin:32px auto 0;position:relative;z-index:2}
.splash-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0ea5e9,#10b981,#06b6d4);border-radius:99px;transition:width .3s}
.splash-studio{font-size:11px;color:var(--dim);letter-spacing:3px;margin-top:18px}

/* Auth */
.auth-lang{position:fixed;top:14px;right:14px;z-index:50;display:flex;gap:5px;background:var(--panel);padding:4px;border-radius:11px;border:1px solid var(--line);backdrop-filter:blur(12px)}
.auth-lang button{padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.auth-lang button.on{background:linear-gradient(135deg,rgba(14,165,233,.55),rgba(16,185,129,.3));color:#fff}
.auth-wrap{display:flex;min-height:100vh;max-width:1200px;margin:0 auto}
.auth-brand{flex:1;padding:60px 48px;display:flex;flex-direction:column;justify-content:center}
.auth-brand .b-logo{width:100px;height:100px;animation:logoFloat 4s ease-in-out infinite}
.auth-brand h1{font-size:42px;font-weight:800;letter-spacing:-1.5px;margin:14px 0 0;background:linear-gradient(120deg,#fff,#7dd3fc 40%,#10b981 70%,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-brand .b-sub{font-size:11px;letter-spacing:5px;color:#38bdf8;font-weight:700;margin-top:4px}
.auth-brand .b-cn{font-size:17px;color:#7dd3fc;margin-top:10px;font-weight:600}
body.light .auth-brand .b-cn{color:#0284c7}
.auth-brand ul{list-style:none;padding:0;margin:32px 0 0}
.auth-brand li{padding:13px 0;border-bottom:1px solid var(--line);color:var(--muted);font-size:14px;display:flex;gap:10px;align-items:flex-start}
.auth-brand li::before{content:'◆';color:var(--primary2);font-size:9px;margin-top:8px}
.auth-form{flex:1;padding:60px 48px;display:flex;flex-direction:column;justify-content:center;max-width:520px;margin:0 auto;width:100%}
.auth-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px;backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(14,165,233,.15)}
.auth-tabs{display:flex;gap:6px;background:rgba(11,18,32,.5);padding:5px;border-radius:12px;margin-bottom:22px}
body.light .auth-tabs{background:rgba(14,165,233,.08)}
.auth-tabs button{flex:1;padding:10px;border-radius:9px;font-size:14px;font-weight:700;color:var(--muted)}
.auth-tabs button.on{background:linear-gradient(135deg,#0ea5e9,#10b981);color:#fff;box-shadow:0 6px 20px rgba(14,165,233,.4)}
.field{margin-bottom:14px;position:relative}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;background:rgba(11,18,32,.6);border:1px solid var(--line);color:var(--text);outline:none;transition:.15s}
body.light .field input,body.light .field select,body.light .field textarea{background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,165,233,.2)}
.field textarea{resize:vertical;min-height:96px}
.pwd-wrap{position:relative}.pwd-wrap input{padding-right:46px}
.pwd-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;display:grid;place-items:center;font-size:16px;color:var(--muted);cursor:pointer;border-radius:8px}
.pwd-eye:hover{background:rgba(14,165,233,.15);color:#fff}
.pwd-strength{height:4px;background:rgba(14,165,233,.15);border-radius:99px;margin-top:6px;overflow:hidden}
.pwd-strength i{display:block;height:100%;transition:width .3s,background .3s;width:0}
.pwd-hint{font-size:11px;color:var(--dim);margin-top:4px}
.btn{padding:13px 20px;border-radius:12px;font-size:14.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#10b981);color:#fff;box-shadow:0 8px 24px rgba(14,165,233,.35)}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-ghost{background:rgba(14,165,233,.1);border:1px solid var(--line);color:var(--text)}
.btn-ghost:hover{background:rgba(14,165,233,.2)}
.btn-danger{background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.4);color:#fca5a5}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn-full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.verify-box{background:rgba(11,18,32,.5);border:1px dashed rgba(14,165,233,.35);border-radius:12px;padding:14px;margin-bottom:14px}
body.light .verify-box{background:#f0f9ff}
.verify-box .v-title{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}
.verify-box .v-row{display:flex;gap:10px;align-items:center}
.verify-box .v-q{flex:1;font-size:16px;font-weight:800;color:var(--primary2);background:rgba(16,185,129,.1);padding:9px 12px;border-radius:9px;text-align:center}
.verify-box input{width:90px;text-align:center;font-weight:800}
.err{font-size:12.5px;color:#fca5a5;margin-top:8px;min-height:17px}
.hint{font-size:11.5px;color:var(--dim);margin-top:14px;line-height:1.6;text-align:center}
.link{font-size:13px;color:var(--primary2);cursor:pointer;text-decoration:underline;margin-top:10px;display:inline-block}
.role-pick{display:flex;gap:10px}
.role-pick button{flex:1;padding:14px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(11,18,32,.4);font-size:13.5px;font-weight:700;color:var(--muted)}
body.light .role-pick button{background:#fff}
.role-pick button.on{border-color:var(--primary);background:rgba(14,165,233,.16);color:var(--text)}
@media(max-width:800px){.auth-brand{display:none}.auth-form{padding:80px 20px 40px;max-width:100%}}

/* App */
.appbar{position:sticky;top:0;z-index:40;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--panel);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.appbar-left{display:flex;align-items:center;gap:11px}
.appbar-left .vs-mini{width:34px;height:34px}
.app-name{font-size:15.5px;font-weight:800;line-height:1.15;background:linear-gradient(120deg,#7dd3fc,#10b981 70%,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.app-school{font-size:10px;letter-spacing:1.6px;color:var(--dim);font-weight:700}
.appbar-right{display:flex;align-items:center;gap:9px}
.user-chip{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;background:rgba(14,165,233,.15);border:1px solid rgba(14,165,233,.3);font-size:12.5px;font-weight:700;max-width:190px;cursor:pointer;transition:.15s}
.user-chip:hover{background:rgba(14,165,233,.25)}
.user-chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-chip .rl{font-size:10px;padding:1px 7px;border-radius:99px;background:rgba(16,185,129,.25);color:#6ee7b7;flex-shrink:0}
.avatar-mini{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#10b981);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex-shrink:0;overflow:hidden}
.avatar-mini img{width:100%;height:100%;object-fit:cover}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(14,165,233,.1);border:1px solid var(--line);font-size:15px;position:relative}
.icon-btn:hover{background:rgba(14,165,233,.24)}
.dot-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;border-radius:99px;display:flex;align-items:center;justify-content:center}
.app-body{display:flex;min-height:calc(100vh - 60px)}
.appnav{width:224px;flex-shrink:0;padding:16px 12px;border-right:1px solid var(--line);background:var(--panel)}
.appnav a{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:11px;color:var(--muted);font-size:13.5px;font-weight:600;margin-bottom:3px;cursor:pointer;border:1px solid transparent;transition:.15s}
.appnav a:hover{background:rgba(14,165,233,.12);color:var(--text)}
.appnav a.on{background:linear-gradient(135deg,rgba(14,165,233,.3),rgba(16,185,129,.15));color:var(--text);border-color:rgba(14,165,233,.4)}
.appmain{flex:1;padding:26px 30px;max-width:1080px;min-width:0}
@media(max-width:800px){.app-body{flex-direction:column}.appnav{width:100%;display:flex;overflow-x:auto;gap:6px;padding:10px;border-right:none;border-bottom:1px solid var(--line)}.appnav a{white-space:nowrap;margin:0;padding:9px 13px;font-size:12.5px}.appmain{padding:18px 15px}.app-school{display:none}.user-chip{max-width:160px}}

.page-title{font-size:25px;font-weight:800;letter-spacing:-.6px;margin:0 0 4px;color:var(--text)}
.page-sub{font-size:13px;color:var(--muted);margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;backdrop-filter:blur(12px)}
.card h3{margin:0 0 12px;font-size:15px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(12px)}
.stat .n{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:600}
.stat.blue .n{color:#7dd3fc}.stat.yellow .n{color:#fbbf24}.stat.green .n{color:#34d399}.stat.red .n{color:#f87171}
.hero{background:linear-gradient(135deg,rgba(14,165,233,.25),rgba(16,185,129,.1));border:1px solid rgba(14,165,233,.3);border-radius:20px;padding:24px;margin-bottom:18px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,.4),transparent 70%);pointer-events:none}
.hero h2{margin:0 0 6px;font-size:20px;font-weight:800;position:relative}
.hero p{margin:0 0 14px;font-size:13.5px;color:var(--muted);position:relative}
.quick{display:flex;gap:9px;flex-wrap:wrap;position:relative}
.quick button{padding:10px 16px;border-radius:11px;font-size:13px;font-weight:700;background:rgba(11,18,32,.6);border:1px solid var(--line);color:var(--text)}
body.light .quick button{background:#fff}
.quick button:hover{border-color:var(--primary);background:rgba(14,165,233,.15)}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700}
.badge.pending{background:rgba(245,158,11,.2);color:#fbbf24}
.badge.review{background:rgba(14,165,233,.2);color:#7dd3fc}
.badge.resolved{background:rgba(16,185,129,.2);color:#34d399}
.badge.closed{background:rgba(100,116,139,.25);color:#94a3b8}
.badge.low{background:rgba(16,185,129,.18);color:#34d399}
.badge.mid{background:rgba(245,158,11,.18);color:#fbbf24}
.badge.high{background:rgba(239,68,68,.2);color:#f87171}
.badge.critical{background:rgba(239,68,68,.3);color:#fca5a5}
.badge.info{background:rgba(6,182,212,.2);color:#67e8f9}
.badge.approved{background:rgba(16,185,129,.2);color:#34d399}
.badge.rejected{background:rgba(239,68,68,.2);color:#f87171}
.badge.blocked{background:rgba(100,116,139,.25);color:#94a3b8}
.badge.healthy{background:rgba(16,185,129,.22);color:#34d399}
.badge.normal{background:rgba(245,158,11,.22);color:#fbbf24}
.badge.unhealthy{background:rgba(239,68,68,.25);color:#f87171}
.empty{text-align:center;padding:44px 20px;color:var(--dim);font-size:13.5px}
.empty .ic{font-size:42px;display:block;margin-bottom:12px;opacity:.5}
.list-item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:11px;cursor:pointer;transition:.16s}
.list-item:hover{border-color:rgba(14,165,233,.5);transform:translateY(-1px)}
.li-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.li-code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#67e8f9;font-weight:700}
.li-desc{font-size:13.5px;color:var(--muted);margin-bottom:8px;line-height:1.6}
.li-meta{font-size:11.5px;color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--line);background:rgba(11,18,32,.4)}
body.light th{background:#f0f9ff}
td{padding:11px 12px;border-bottom:1px solid var(--line);color:var(--muted)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(14,165,233,.05)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:400px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.chat-head{padding:14px 18px;border-bottom:1px solid var(--line);background:rgba(11,18,32,.4);display:flex;justify-content:space-between;align-items:center}
body.light .chat-head{background:#f0f9ff}
.chat-head h3{margin:0;font-size:15px;font-weight:800}
.chat-head p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.chat-badge{font-size:10px;padding:3px 8px;border-radius:99px;background:rgba(6,182,212,.18);color:#67e8f9;font-weight:700}
.chat-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:82%;padding:12px 15px;border-radius:16px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg.ai{align-self:flex-start;background:rgba(14,165,233,.15);border:1px solid rgba(14,165,233,.3);border-bottom-left-radius:5px}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,rgba(14,165,233,.95),rgba(16,185,129,.85));color:#fff;border-bottom-right-radius:5px}
.msg.crisis{align-self:flex-start;background:rgba(239,68,68,.18);border:1px solid rgba(239,68,68,.5);border-bottom-left-radius:5px;color:#fca5a5}
.chat-input{display:flex;gap:9px;padding:13px;border-top:1px solid var(--line);background:rgba(11,18,32,.4)}
body.light .chat-input{background:#f0f9ff}
.chat-input input{flex:1;padding:12px 15px;border-radius:12px;background:rgba(11,18,32,.7);border:1px solid var(--line);color:var(--text);outline:none}
body.light .chat-input input{background:#fff}
.chat-input input:focus{border-color:var(--primary)}
.chat-input button{padding:0 20px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#10b981);color:#fff;font-weight:700;font-size:14px}
.typing{align-self:flex-start;padding:12px 18px;color:var(--muted);font-size:13px;letter-spacing:3px}
.suggest{display:flex;gap:7px;flex-wrap:wrap;padding:0 13px 13px}
.suggest button{padding:7px 13px;border-radius:99px;font-size:12px;background:rgba(14,165,233,.1);border:1px solid var(--line);color:var(--muted)}
.suggest button:hover{border-color:var(--primary);color:var(--text)}
.modal{position:fixed;inset:0;background:rgba(11,18,32,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:200;padding:18px}
.modal.on{display:flex}
.modal-box{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;position:relative;box-shadow:0 30px 80px rgba(14,165,233,.25)}
.modal-box h2{margin:0 0 6px;font-size:20px;font-weight:800}
.modal-close{position:absolute;top:14px;right:14px}
.test-prog{height:6px;background:rgba(14,165,233,.15);border-radius:99px;overflow:hidden;margin-bottom:8px}
.test-prog i{display:block;height:100%;background:linear-gradient(90deg,#0ea5e9,#10b981,#06b6d4);transition:width .35s;border-radius:99px}
.opt{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border-radius:13px;background:rgba(11,18,32,.5);border:1px solid var(--line);margin-bottom:12px;cursor:pointer;font-size:15px;line-height:1.5;min-height:56px;transition:.16s;width:100%}
body.light .opt{background:#fff}
.opt:hover{border-color:rgba(14,165,233,.5);background:rgba(14,165,233,.08)}
.opt.on{border-color:var(--primary);background:rgba(14,165,233,.18);font-weight:700}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(14,165,233,.5);flex-shrink:0;margin-top:4px}
.opt.on .dot{border-color:var(--primary);background:linear-gradient(135deg,#0ea5e9,#10b981);box-shadow:inset 0 0 0 3px var(--panel2)}
.opt span:last-child{flex:1;word-break:break-word}
.dim-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.dim-row:last-child{border-bottom:none}
.dim-name{flex:1;font-size:13.5px}
.dim-name .lbl{font-size:12px;font-weight:700;margin-top:2px}
.score-card{border-radius:20px;padding:26px;margin-bottom:18px}
.lock-card{text-align:center;padding:36px 26px;max-width:460px;margin:40px auto}
.lock-card .ic{font-size:48px;margin-bottom:14px;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}
.spinner{width:30px;height:30px;border:3px solid rgba(14,165,233,.25);border-top-color:var(--primary,#0ea5e9);border-radius:50%;animation:spin 1s linear infinite;margin:34px auto 0}
@keyframes spin{to{transform:rotate(360deg)}}
.countdown{font-size:26px;font-weight:800;font-family:ui-monospace,Menlo,monospace;color:var(--primary);margin:12px 0}
.lang-pick-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.lang-pick-box{max-width:480px;width:100%;text-align:center}
.lang-pick-box .globe{font-size:56px;margin-bottom:16px}
.lang-pick-box h1{font-size:26px;font-weight:800;margin:0 0 6px}
.lang-pick-box .sub{font-size:14px;color:var(--muted);margin:0 0 32px}
.lang-pick-box .opts{display:flex;flex-direction:column;gap:12px}
.lang-pick-box .opts button{padding:18px;font-size:16px}
.lang-pick-box .note{font-size:12px;color:var(--dim);margin-top:24px}
.stars{display:flex;gap:6px}
.stars span{font-size:26px;cursor:pointer;opacity:.35;transition:.15s}
.stars span.on{opacity:1;transform:scale(1.05)}
.participant-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.participant-row input{padding:10px 12px;font-size:14px;border-radius:10px;background:rgba(11,18,32,.6);border:1px solid var(--line);color:var(--text);outline:none}
body.light .participant-row input{background:#fff}
.participant-row input:focus{border-color:var(--primary)}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:10px}
.media-thumb{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:rgba(11,18,32,.6);border:1px solid var(--line)}
.media-thumb img,.media-thumb video{width:100%;height:100%;object-fit:cover}
.msg-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;transition:.15s}
.msg-card:hover{border-color:rgba(14,165,233,.5)}
.msg-card.unread{border-left:3px solid var(--primary2);background:rgba(16,185,129,.06)}
.msg-card .title{font-size:15px;font-weight:800;margin-bottom:6px}
.msg-card .meta{font-size:11.5px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.msg-card .preview{font-size:13px;color:var(--muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg-card .actions{margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.like-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.35);color:#6ee7b7;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
.like-btn.on{background:rgba(16,185,129,.3);color:#fff}
.view-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;background:linear-gradient(135deg,#0ea5e9,#10b981);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;border:none}
.view-btn:hover{filter:brightness(1.1)}

/* Stress Menu */
.stress-menu{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
@media(max-width:560px){.stress-menu{grid-template-columns:1fr}}
.stress-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px 24px;text-align:center;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.stress-card:hover{transform:translateY(-3px);border-color:var(--primary);box-shadow:0 20px 50px rgba(14,165,233,.25)}
.stress-card .ic{font-size:56px;display:block;margin-bottom:14px}
.stress-card h3{margin:0 0 8px;font-size:18px;font-weight:800}
.stress-card p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}

/* Sound */
.sound-stage{padding:32px 20px;text-align:center}
.sound-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-top:20px}
.sound-btn{padding:26px 16px;border-radius:18px;background:var(--panel);border:1px solid var(--line);text-align:center;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.sound-btn:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:0 15px 40px rgba(14,165,233,.3)}
.sound-btn.active{background:linear-gradient(135deg,rgba(14,165,233,.35),rgba(16,185,129,.25));border-color:var(--primary)}
.sound-btn .ic{font-size:36px;display:block;margin-bottom:8px}

/* Bubble */
.bubble-stage{position:relative;width:100%;height:calc(100vh - 280px);min-height:420px;background:linear-gradient(160deg,rgba(14,165,233,.15),rgba(16,185,129,.08),rgba(6,182,212,.08));border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-top:16px}
.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.85),rgba(14,165,233,.45) 60%,rgba(16,185,129,.25));border:1px solid rgba(255,255,255,.4);cursor:pointer;box-shadow:0 8px 24px rgba(14,165,233,.35),inset 0 0 30px rgba(255,255,255,.25);animation:floatUp linear}
@keyframes floatUp{from{transform:translateY(100%) scale(.6);opacity:0}10%{opacity:1;transform:translateY(80%) scale(1)}to{transform:translateY(-120%) scale(1)}}
.bubble:hover{filter:brightness(1.2)}
.bubble-pop{position:absolute;font-size:15px;font-weight:700;color:#fff;padding:12px 18px;border-radius:16px;background:linear-gradient(135deg,rgba(14,165,233,.98),rgba(16,185,129,.9));box-shadow:0 10px 30px rgba(14,165,233,.55);pointer-events:none;animation:popText 3.5s forwards;max-width:280px;line-height:1.5;z-index:10;text-align:center}
@keyframes popText{0%{opacity:0;transform:translateY(20px) scale(.6)}15%{opacity:1;transform:translateY(-10px) scale(1.08)}20%{transform:translateY(0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.stress-back{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:11px;background:var(--panel);border:1px solid var(--line);font-size:13.5px;font-weight:700;margin-bottom:12px;cursor:pointer}
.stress-back:hover{border-color:var(--primary)}

/* Profile */
.profile-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.profile-avatar{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#10b981);display:grid;place-items:center;color:#fff;font-size:38px;font-weight:800;overflow:hidden;position:relative;flex-shrink:0;border:3px solid var(--line)}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-avatar label{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.65);color:#fff;text-align:center;font-size:10px;padding:4px;cursor:pointer;font-weight:700}
.profile-avatar input{display:none}

/* Settings */
.set-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);gap:14px;flex-wrap:wrap}
.set-row:last-child{border-bottom:none}
.set-label{font-size:14px;font-weight:700}
.set-desc{font-size:11.5px;color:var(--dim);margin-top:2px}
.set-ctrl{display:flex;gap:6px;flex-wrap:wrap}
.set-btn{padding:8px 14px;border-radius:10px;background:rgba(14,165,233,.1);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--text)}
.set-btn.on{background:linear-gradient(135deg,rgba(14,165,233,.4),rgba(16,185,129,.3));border-color:var(--primary)}
.switch{position:relative;width:52px;height:28px;background:rgba(14,165,233,.2);border-radius:99px;cursor:pointer;transition:.2s;border:1px solid var(--line)}
.switch.on{background:linear-gradient(135deg,#0ea5e9,#10b981);border-color:transparent}
.switch i{position:absolute;top:2px;left:2px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s}
.switch.on i{left:26px}
</style>

function t(k, vars){
  let s = (I18N[state.lang] && I18N[state.lang][k]) || I18N.en[k] || k;
  if(vars) for(const kk in vars) s = s.replace('{'+kk+'}', vars[kk]);
  return s;
}
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FORMS = ['PERALIHAN','FORM 1','FORM 2','FORM 3','FORM 4','FORM 5','FORM 6'];
const SECTIONS = ['A','B','C','D'];
const GENDERS = ['male','female','other'];
const RACES = ['malay','chinese','indian','iban','kadazan','others'];
const SLOGAN = {zh:'说出来，不孤单', en:'Speak up. You are not alone', ms:'Bersuara. Anda tidak keseorangan'};

function applyTheme(){ document.body.classList.toggle('light', state.theme === 'light'); }
applyTheme();

function isValidFullName(name){
  if(!name || name.length < 5) return false;
  if(name !== name.toUpperCase()) return false;
  if(!/^[A-Z][A-Z\s.']*$/.test(name)) return false;
  const words = name.trim().split(/\s+/).filter(w => w.replace(/[.']/g,'').length >= 2);
  if(words.length < 2) return false;
  if(/(.)\1{3,}/.test(name)) return false;
  return true;
}
function pwdStrength(p){
  let s = 0;
  if(p.length >= 8) s++;
  if(/[A-Z]/.test(p)) s++;
  if(/[a-z]/.test(p)) s++;
  if(/[0-9]/.test(p)) s++;
  if(/[^A-Za-z0-9]/.test(p)) s++;
  return s;
}
function initials(name){ return (name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function avatarHTML(u){
  if(u && u.avatar_url) return `<img src="${u.avatar_url}" alt="">`;
  return esc(initials(u && u.name));
}
function detectLang(text){
  const s = String(text||'');
  if(/[\u4e00-\u9fff]/.test(s)) return 'zh';
  if(/\b(saya|awak|tak|nak|kena|boleh|dengan|untuk|dan|ini|itu|ada|tidak|jangan)\b/i.test(s)) return 'ms';
  return 'en';
}
function updateSlogan(){
  const sl = $('splashSlogan'); if(sl) sl.textContent = SLOGAN[state.lang];
  const bs = $('brandSlogan'); if(bs) bs.textContent = SLOGAN[state.lang];
}

function newVerify(){ return {a:Math.floor(Math.random()*8)+2,b:Math.floor(Math.random()*8)+2}; }
function pwdField(id, label, ph){ return `<div class="field"><label>${label}</label><div class="pwd-wrap"><input id="${id}" type="password" placeholder="${ph}" oninput="updatePwdBar('${id}','${id}_bar')"><span class="pwd-eye" data-target="${id}">👁</span></div><div class="pwd-strength" id="${id}_bar"><i></i></div><div class="pwd-hint">${t('pwdHint')}</div></div>`; }
function updatePwdBar(id, barId){
  const inp = document.getElementById(id); if(!inp) return;
  const s = pwdStrength(inp.value);
  const bar = document.getElementById(barId); if(!bar) return;
  const fill = bar.querySelector('i');
  let w = '0%', col = '#64748b';
  if(s <= 2){ w='33%'; col='#ef4444'; }
  else if(s <= 3){ w='66%'; col='#f59e0b'; }
  else { w='100%'; col='#10b981'; }
  fill.style.width = w; fill.style.background = col;
}
function bindPwdEyes(){ document.querySelectorAll('.pwd-eye').forEach(el=>{ el.onclick = ()=>{ const inp = $(el.dataset.target); if(!inp) return; inp.type = inp.type === 'password' ? 'text' : 'password'; el.textContent = inp.type === 'password' ? '👁' : '🙈'; }; }); }

function renderAuth(){
  updateSlogan();
  const langs=[['zh','华文'],['en','English'],['ms','Bahasa Melayu']];
  $('authLang').innerHTML = langs.map(([k,l])=>`<button data-lang="${k}" class="${state.lang===k?'on':''}">${l}</button>`).join('');
  $('authLang').querySelectorAll('button').forEach(b=>{ b.onclick=()=>{ state.lang=b.dataset.lang; localStorage.setItem('vs_lang',state.lang); updateSlogan(); renderAll(); }; });
  $('brandList').innerHTML = ['brand1','brand2','brand3','brand4'].map(k=>`<li>${t(k)}</li>`).join('');

  if(state.authMode === 'forgot'){
    $('authTabs').innerHTML = '';
    $('authBody').innerHTML = `<h2 style="margin:0 0 6px;font-size:19px;font-weight:800">${t('forgotTitle')}</h2><p style="font-size:13px;color:var(--muted);margin:0 0 18px">${t('forgotSub')}</p><div class="field"><label>${t('email')}</label><input id="fpEmail" type="email" placeholder="yourname@gmail.com"></div><div class="err" id="authErr"></div><button class="btn btn-primary btn-full" id="btnReset">${t('sendReset')}</button><div style="text-align:center"><span class="link" id="backLogin">${t('backToLogin')}</span></div>`;
    $('btnReset').onclick = doResetPassword;
    $('backLogin').onclick = ()=>{ state.authMode='login'; renderAuth(); };
    return;
  }
  $('authTabs').innerHTML = `<button data-tab="login" class="${state.authTab==='login'?'on':''}">${t('login')}</button><button data-tab="register" class="${state.authTab==='register'?'on':''}">${t('register')}</button>`;
  $('authTabs').querySelectorAll('button').forEach(b=>{ b.onclick=()=>{ state.authTab=b.dataset.tab; state.verify=newVerify(); renderAuth(); }; });
  const v = state.verify;

async function doLogin(){
  const email = ($('liEmail').value||'').trim().toLowerCase();
  const pwd = $('liPwd').value||'';
  const vv = ($('verifyInput').value||'').trim();
  const err = $('authErr'); const show = m => err.textContent = m;
  if(!email) return show(t('errEmail'));
  if(!email.endsWith('@gmail.com')) return show(t('errGmail'));
  if(!pwd) return show(t('errPwd'));
  if(vv !== String(state.verify.a+state.verify.b)){ state.verify=newVerify(); renderAuth(); return setTimeout(()=>{$('authErr').textContent=t('verifyWrong');},10); }
  show('Signing in…');
  const {data, error} = await sb.auth.signInWithPassword({email, password:pwd});
  if(error) return show(error.message);
  await new Promise(r=>setTimeout(r, 600));
  let {data:prof} = await sb.from('profiles').select('*').eq('id', data.user.id).maybeSingle();
  if(!prof){
    const {data:created} = await sb.from('profiles').insert({id:data.user.id, email:email, name:email.split('@')[0].toUpperCase(), role:'student', class_name:''}).select().single();
    if(created) prof = created;
  }
  if(!prof) return show('Profile not found.');
  const {data:app} = await sb.from('teacher_applications').select('*').eq('user_id', prof.id).order('created_at',{ascending:false}).limit(1).maybeSingle();
  if(app){
    if(app.status === 'pending'){ await sb.auth.signOut(); return show(t('teacherPending')); }
    if(app.status === 'rejected'){ await sb.auth.signOut(); return show(t('teacherRejected')); }
    if(app.status === 'blocked'){ await sb.auth.signOut(); return show(t('teacherBlocked')); }
  }
  state.user = {id:prof.id, name:prof.name, email:prof.email, role:prof.role, className:prof.class_name, avatar_url:prof.avatar_url, gender:prof.gender, race:prof.race, birthday:prof.birthday};
  await refreshUnread();
  if(!localStorage.getItem('vs_lang_picked')) showLangPicker(); else await enterApp();
}

async function doRegister(){
  const name = ($('rgName').value||'').trim().toUpperCase();
  const email = ($('rgEmail').value||'').trim().toLowerCase();
  const pwd = $('rgPwd').value||'';
  const pwd2 = $('rgPwd2').value||'';
  const vv = ($('verifyInput').value||'').trim();
  const gender = $('rgGender').value;
  const race = $('rgRace').value;
  const err = $('authErr'); const show = m => err.textContent = m;
  if(!name) return show(t('errName'));
  if(!isValidFullName(name)) return show(t('errNameFormat') + ' ' + t('errNameSilly'));
  if(!email) return show(t('errEmail'));
  if(!email.endsWith('@gmail.com')) return show(t('errGmail'));
  if(!gender) return show(t('errGender'));
  if(!race) return show(t('errRace'));
  if(pwd.length<8) return show(t('errPwdLen'));
  if(!/[A-Z]/.test(pwd)) return show(t('errPwdUpper'));
  if(!/[a-z]/.test(pwd)) return show(t('errPwdLower'));
  if(!/[0-9]/.test(pwd)) return show(t('errPwdNum'));
  if(pwd!==pwd2) return show(t('errPwdMatch'));

  let cls = '';

    const f = $('rgForm').value;
    if(!f) return show(t('errForm'));
    if(f === 'PERALIHAN') cls = 'PERALIHAN';
    else {
      const s = $('rgClass').value;
      if(!s) return show(t('errClass'));
      cls = f + ' ' + s;
    }
  }
  if(vv !== String(state.verify.a+state.verify.b)){ state.verify=newVerify(); renderAuth(); return setTimeout(()=>{$('authErr').textContent=t('verifyWrong');},10); }

  openModal(`
    <h2>${t('confirmTitle')}</h2>
    <p style="color:var(--muted);font-size:13px;margin:0 0 18px">${t('confirmSub')}</p>
    <div class="set-row"><div class="set-label">${t('confirmName')}</div><div style="font-weight:700">${esc(name)}</div></div>
    <div class="set-row"><div class="set-label">${t('confirmGender')}</div><div style="font-weight:700">${t(gender)}</div></div>
    <div class="set-row"><div class="set-label">${t('confirmRace')}</div><div style="font-weight:700">${t(race)}</div></div>
    ${cls?`<div class="set-row"><div class="set-label">${t('classSec')}</div><div style="font-weight:700">${esc(cls)}</div></div>`:''}
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeModal()">${t('confirmEdit')}</button>
      <button class="btn btn-primary" style="flex:1" id="cfOk">${t('confirmOk')}</button>
    </div>
  `);
  $('cfOk').onclick = async ()=>{ closeModal(); await actuallyRegister({name, email, pwd, cls, gender, race}); };

async function actuallyRegister({name, email, pwd, cls, gender, race}){
  const err = $('authErr'); const show = m => err.textContent = m;
  if(state.role === 'teacher'){
    try{
      const {data:exists} = await sb.rpc('check_teacher_email', { check_email: email });
      if(exists){ return show(t('errTeacherEmailUsed')); }
    }catch(e){}
  }
  show('Creating account…');
  const {data, error} = await sb.auth.signUp({email, password:pwd, options:{data:{name, role:'student', class_name:cls, gender, race}}});
  if(error){ if(error.message.toLowerCase().includes('already')) return show(t('errExists')); return show(error.message); }
  if(!data.user) return show('Sign up failed.');
  if(!data.session) return show('Confirm email.');

  if(state.role === 'teacher'){
    const {error: pErr} = await sb.from('profiles').upsert({id: data.user.id, email, name, role:'student', class_name:'', gender, race}, {onConflict:'id'});
    if(pErr) console.warn(pErr);
    await sb.from('teacher_applications').insert({user_id: data.user.id, email: email.toLowerCase(), name, status:'pending'});
    await sb.auth.signOut();
    alert(t('teacherApplied'));
    state.authTab = 'login';
    renderAuth();
    return;
  }

  const {error: pErr} = await sb.from('profiles').upsert({id: data.user.id, email, name, role:'student', class_name:cls, preferred_language: state.lang, gender, race}, {onConflict:'id'});
  if(pErr) console.warn(pErr);
  let {data:prof} = await sb.from('profiles').select('*').eq('id', data.user.id).maybeSingle();
  if(!prof) return show('Profile creation failed.');
  state.user = {id:prof.id, name:prof.name, email:prof.email, role:prof.role, className:prof.class_name, avatar_url:prof.avatar_url, gender:prof.gender, race:prof.race, birthday:prof.birthday};
  localStorage.setItem('vs_lang_picked', '1');
  await refreshUnread();
  await enterApp();
}

function drawChat(){

  body.innerHTML = state.chat.map(m=>{

async function sendChat(){
  const inp = $('chatIn'); const text = (inp.value||'').trim(); if(!text) return;
  state.chat.push({role:'me', text}); inp.value=''; drawChat();
  const body = $('chatBody');
  const typing = document.createElement('div');
  typing.className='typing'; typing.textContent='Mr Safe ···';
  body.appendChild(typing); body.scrollTop = body.scrollHeight;
  const res = await aiRespond(text);
  typing.remove();
  state.chat.push({role:'ai', text:res.text, risk:res.risk});
  drawChat();
}
const AI_TOPICS = [
  {id:'crisis',risk:3,kw:['不想活','自杀','自残','割腕','想死','kill myself','suicide','want to die','self harm','nak mati','bunuh diri']},
  {id:'harass',risk:3,kw:['性骚扰','猥亵','摸我','偷拍','裸照','非礼','sexual harassment','molest','groped','gangguan seksual','dicabul']},
  {id:'threat',risk:2,kw:['威胁','恐吓','勒索','抢钱','要打我','threaten','blackmail','ugut','ancam']},
  {id:'cyber',risk:2,kw:['网络霸凌','网暴','假账号','被P图','cyberbully','fake account','buli siber']},
  {id:'bully',risk:2,kw:['霸凌','欺凌','欺负','被打','被骂','被推','被踢','排挤','孤立','bully','bullied','hit me','buli','dibuli']},
  {id:'emotion',risk:1,kw:['难过','伤心','哭','抑郁','低落','崩溃','孤独','很累','sad','depressed','cry','lonely','sedih']},
  {id:'anxiety',risk:1,kw:['焦虑','紧张','害怕','恐惧','恐慌','睡不着','失眠','anxious','nervous','scared','panic','cemas','takut']},
  {id:'safety',risk:1,kw:['不安全','危险','有人跟踪','陌生人','unsafe','dangerous','tidak selamat']}
];
function detectTopic(text){
  const s = String(text||'').toLowerCase();
  let best=null, bs=0;
  for(const tp of AI_TOPICS){
    let sc=0;
    for(const kw of tp.kw){ if(s.includes(kw.toLowerCase())) sc += kw.length>3?2:1.2; }
    if(sc>bs){ bs=sc; best=tp; }
  }
  return bs>=1.2?best:null;
}
async function aiRespond(text){
  const tp = detectTopic(text);
  const lang = detectLang(text);
  try{
    const history = state.chat.filter(m => !(m.role==='ai' && m.text===t('chatWelcome'))).map(m => ({ role: m.role==='me' ? 'user' : 'assistant', content: m.text }));
    history.push({ role:'user', content: text });
    const resp = await fetch(SUPABASE_URL + '/functions/v1/' + FN_CHAT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, lang })
    });
    const rawText = await resp.text();
    let reply = null;
    try{ const p = JSON.parse(rawText); reply = p.reply || null; } catch(e){ reply = rawText; }
    if(!reply || reply.length < 2) throw new Error('Empty');
    state.aiOnline = true;
    return { text: reply, risk: tp?.risk ?? 0 };
  } catch(e){
    state.aiOnline = false;
    if(!tp) return { text: t('aiOnly'), risk: 0 };
    return { text: t('aiOnly'), risk: tp.risk };
  }
}

let lockTimer=null;
async function testLockRemaining(){
  const list = await fetchAssessments(state.user.id);
  if(!list.length) return 0;
  const last = new Date(list[0].created_at).getTime();
  return Math.max(0, 12*60*60*1000 - (Date.now()-last));
}
async function viewTest(){
  const remain = await testLockRemaining();
  if(remain>0){
    const list = await fetchAssessments(state.user.id);
    $('appmain').innerHTML = `<h1 class="page-title">${t('testTitle')}</h1><p class="page-sub">${t('testSub')}</p>
      <div class="lock-card card"><div class="ic">🔒</div><h3 style="margin:0 0 8px;font-size:17px">${t('testLocked')}</h3><div class="countdown" id="cd">--:--</div><p style="font-size:13px;color:var(--muted);margin:0 0 20px">${t('testLockNote')}</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn btn-ghost" id="viewLast">${t('viewLast')}</button><button class="btn btn-ghost" onclick="goHome()">${t('backHome')}</button></div></div>`;
    $('viewLast').onclick = ()=> showResult(list[0]);
    startCountdown(remain); return;
  }
  if(lockTimer){ clearInterval(lockTimer); lockTimer=null; }
  $('appmain').innerHTML = `<h1 class="page-title">${t('testTitle')}</h1><p class="page-sub">${t('testSub')}</p>
    <div class="card" style="text-align:center;padding:40px 24px"><div style="font-size:52px;margin-bottom:14px">🧠</div><p style="font-size:14px;color:var(--muted);max-width:440px;margin:0 auto 24px;line-height:1.75">${t('forceMsg')}</p><button class="btn btn-primary" id="startTest">${t('testStart')}</button></div>`;
  $('startTest').onclick = startTest;
}
function goHome(){ state.view='home'; renderApp(); }
function startCountdown(ms){
  let left = Math.floor(ms/1000);
  const el = $('cd');
  const tick = ()=>{
    if(!el) return;
    const m = Math.floor(left/60), s = left%60;
    el.textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    left--;
    if(left<0){ clearInterval(lockTimer); lockTimer=null; renderApp(); }
  };
  tick();
  lockTimer = setInterval(tick, 1000);
}
const AREA_ICON = {mind:'🧠', stress:'⚡', emotion:'💙', relationship:'🤝'};
const AREA_NAME = {mind:['心理','Mind','Minda'], stress:['压力','Stress','Stres'], emotion:['情绪稳定','Emotional stability','Emosi'], relationship:['个人关系','Relationships','Hubungan']};

async function startTest(){
  $('appmain').innerHTML = `<div class="card" style="text-align:center;padding:60px 24px"><div style="font-size:52px;margin-bottom:16px;animation:breathe 2s ease-in-out infinite">🧠</div><h3 style="margin:0 0 8px">${t('genTest')}</h3><div class="spinner" style="margin-top:26px"></div></div>`;
  const questions = await generateTest();
  state.test = {questions, answers:[], index:0};
  renderTestQ();
}
async function generateTest(){
  try{
    const resp = await fetch(SUPABASE_URL + '/functions/v1/' + FN_TEST, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lang: state.lang })
    });
    const rawText = await resp.text();
    let parsed = JSON.parse(rawText);
    if(parsed.questions && parsed.questions.length === 15){
      return parsed.questions.map((q,i)=>{
        let opts = Array.isArray(q.opts) ? q.opts.filter(o => typeof o === 'string' && o.trim().length > 0).map(o => String(o).trim()) : [];
        while(opts.length < 4) opts.push('—');
        opts = opts.slice(0,4);
        const idx = state.lang==='zh'?0:state.lang==='ms'?2:1;
        return { id:'q_'+i, area:q.area||'mind', name: (AREA_NAME[q.area]||AREA_NAME.mind)[idx], q:q.q, opts };
      });
    }
    throw new Error('Bad format');
  }catch(e){ return generateTestLocal(); }
}
const LOCAL_Q = {
  mind:{zh:'最近两周，你多久觉得心里很累？',en:'How often have you felt mentally tired?',ms:'Berapa kerap anda rasa letih mental?'},
  stress:{zh:'最近两周，你多久觉得压力很大？',en:'How often have you felt stressed?',ms:'Berapa kerap anda rasa tertekan?'},
  emotion:{zh:'最近两周，你多久觉得心情低落？',en:'How often have you felt down?',ms:'Berapa kerap anda rasa sedih?'},
  relationship:{zh:'最近两周，你多久觉得没人倾诉？',en:'How often did you feel no one to talk to?',ms:'Berapa kerap tiada siapa boleh didengari?'}
};
function generateTestLocal(){
  const opts = state.lang==='zh'?['从没','偶尔','经常','每天']:state.lang==='ms'?['Tidak','Kadang','Kerap','Setiap hari']:['Never','Sometimes','Often','Every day'];
  const layout = ['mind','mind','mind','mind','stress','stress','stress','stress','emotion','emotion','emotion','emotion','relationship','relationship','relationship'];
  const idx = state.lang==='zh'?0:state.lang==='ms'?2:1;
  return layout.map((a,i)=>({ id:'q_'+i, area:a, name: AREA_NAME[a][idx], q: LOCAL_Q[a][state.lang]||LOCAL_Q[a].en, opts }));
}
function renderTestQ(){
  const T = state.test; const q = T.questions[T.index];
  const total = T.questions.length; const pct = Math.round((T.index/total)*100);
  const sel = T.answers[T.index];
  $('appmain').innerHTML = `
    <div class="card">
      <div class="test-prog"><i style="width:${pct}%"></i></div>
      <div style="font-size:11.5px;color:var(--dim);margin-bottom:18px">${t('qOf')} ${T.index+1} / ${total}</div>
      <div style="font-size:11.5px;color:var(--primary2);font-weight:700;letter-spacing:.5px;margin-bottom:8px">${AREA_ICON[q.area]} ${esc(q.name)}</div>
      <div style="font-size:18px;font-weight:700;line-height:1.5;margin-bottom:22px">${esc(q.q)}</div>
      <div id="opts">${q.opts.map((o,i)=>`<div class="opt ${sel===i?'on':''}" data-i="${i}"><span class="dot"></span><span>${esc(o)}</span></div>`).join('')}</div>
      <div style="display:flex;gap:10px;margin-top:22px">
        <button class="btn btn-ghost" id="tPrev" ${T.index===0?'disabled':''}>← ${t('prev')}</button>
        <button class="btn btn-primary" id="tNext" style="flex:1" ${sel==null?'disabled':''}>${T.index===total-1?t('submitTest'):t('next')} →</button>
      </div>
    </div>`;
  $('opts').querySelectorAll('.opt').forEach(el=>{ el.onclick = ()=>{ T.answers[T.index] = parseInt(el.dataset.i,10); renderTestQ(); }; });
  $('tPrev').onclick = ()=>{ if(T.index>0){ T.index--; renderTestQ(); } };
  $('tNext').onclick = ()=>{ if(T.answers[T.index]==null) return; if(T.index===total-1) submitTest(); else { T.index++; renderTestQ(); } };
}

async function submitTest(){
  const T = state.test;
  $('appmain').innerHTML = `<div class="card" style="text-align:center;padding:60px 24px"><div style="font-size:52px;margin-bottom:16px;animation:breathe 2s ease-in-out infinite">📊</div><h3 style="margin:0 0 8px">${t('analyzing')}</h3><p style="color:var(--muted);font-size:13.5px;margin:0">${t('pleaseWait')}</p><div class="spinner" style="margin-top:26px"></div></div>`;

  const total = T.answers.reduce((a,b)=>a+(b||0),0);
  let level='normal', label=t('levelNormal');
  if(total<=14){ level='healthy'; label=t('levelHealthy'); }
  else if(total<=30){ level='normal'; label=t('levelNormal'); }
  else { level='unhealthy'; label=t('levelUnhealthy'); }

  const areaScores = {mind:0,stress:0,emotion:0,relationship:0};
  T.questions.forEach((q,i)=>{ areaScores[q.area] = (areaScores[q.area]||0) + (T.answers[i]||0); });

  let analysis = null;
  try{
    const r = await fetch(SUPABASE_URL + '/functions/v1/' + FN_ANALYZE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers: T.answers, questions: T.questions, lang: state.lang })
    });
    analysis = await r.json();
  }catch(e){ analysis = null; }

  const dims = [
    {dim:'mind', name:AREA_NAME.mind[state.lang==='zh'?0:state.lang==='ms'?2:1], score:areaScores.mind, max:12},
    {dim:'stress', name:AREA_NAME.stress[state.lang==='zh'?0:state.lang==='ms'?2:1], score:areaScores.stress, max:12},
    {dim:'emotion', name:AREA_NAME.emotion[state.lang==='zh'?0:state.lang==='ms'?2:1], score:areaScores.emotion, max:12},
    {dim:'relationship', name:AREA_NAME.relationship[state.lang==='zh'?0:state.lang==='ms'?2:1], score:areaScores.relationship, max:9}
  ];

  const {data:inserted} = await sb.from('assessments').insert({
    student_id:state.user.id, student_name: state.user.name,
    class_name: state.user.className || '',
    total: total, max: 45, level, label, dims
  }).select().single();

  state.testResult = {total, max:45, level, label, dims, at:Date.now(), analysis};
  state.test = null;
  showResult(state.testResult);
}

function showResult(res){
  if(!res) return;
  const bg = {
    healthy:'linear-gradient(135deg,rgba(16,185,129,.25),rgba(6,182,212,.1))',
    normal:'linear-gradient(135deg,rgba(245,158,11,.25),rgba(14,165,233,.1))',
    unhealthy:'linear-gradient(135deg,rgba(239,68,68,.28),rgba(16,185,129,.12))'
  }[res.level];
  const bd = {healthy:'rgba(16,185,129,.4)',normal:'rgba(245,158,11,.4)',unhealthy:'rgba(239,68,68,.5)'}[res.level];

  const a = res.analysis || {};
  const dimRows = (res.dims||[]).map(d=>{
    const detail = (a.details && a.details[d.dim]) ? (typeof a.details[d.dim] === 'string' ? {level:'normal', text:a.details[d.dim]} : a.details[d.dim]) : null;
    const lvl = detail?.level || (d.score/d.max > .66 ? 'unhealthy' : d.score/d.max > .33 ? 'normal' : 'healthy');
    const lvlKey = lvl==='healthy'?'levelHealthy':lvl==='unhealthy'?'levelUnhealthy':'levelNormal';
    const col = lvl==='healthy'?'#34d399':lvl==='unhealthy'?'#f87171':'#fbbf24';
    return `<div class="dim-row"><div class="dim-name">${AREA_ICON[d.dim]} ${esc(d.name)}<div class="lbl" style="color:${col}">${t(lvlKey)}</div>${detail?.text?`<div style="font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5">${esc(detail.text)}</div>`:''}</div></div>`;
  }).join('');

  const adviceHTML = (a.advice && a.advice.length) ? `<div class="card"><h3>${t('advice')}</h3><div style="font-size:14px;color:var(--muted);line-height:1.9">${a.advice.map(x=>'• '+esc(x)).join('<br>')}</div></div>` : '';
  const encourage = a.encouragement ? `<div class="card" style="background:linear-gradient(135deg,rgba(16,185,129,.15),rgba(14,165,233,.08));border-color:rgba(16,185,129,.35);font-size:14px">💙 ${esc(a.encouragement)}</div>` : '';
  const urgentNeeded = res.level==='unhealthy';
  const urgentHTML = urgentNeeded ? `<div class="card" style="background:linear-gradient(135deg,rgba(239,68,68,.2),rgba(16,185,129,.1));border-color:rgba(239,68,68,.5)"><h3 style="color:#fca5a5">🚨 ${t('urgent')}</h3><div style="font-size:13.5px;line-height:2"><a href="tel:999" style="color:var(--text);text-decoration:none">📞 999</a><br><a href="tel:15999" style="color:var(--text);text-decoration:none">📞 15999</a><br><a href="tel:0376272929" style="color:var(--text);text-decoration:none">📞 03-7627 2929</a></div></div>` : '';

  $('appmain').innerHTML = `
    <h1 class="page-title">${t('resultTitle')}</h1><p class="page-sub">${new Date(res.at||Date.now()).toLocaleString()}</p>
    <div class="score-card" style="background:${bg};border:1px solid ${bd}">
      <div style="font-size:34px;font-weight:800">${esc(res.label)}</div>
      <div style="font-size:13px;color:var(--muted);margin-top:10px;line-height:1.7">${t('notDiag')}</div>
    </div>
    <div class="card"><h3>${t('dimBreak')}</h3>${dimRows}</div>
    ${urgentHTML}
    ${adviceHTML}
    ${encourage}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">
      <button class="btn btn-ghost" onclick="goHome()">${t('backHome')}</button>
      <button class="btn btn-ghost" onclick="state.view='ai';renderApp()">🛡️ ${t('quickChat')}</button>
      <button class="btn btn-ghost" onclick="stopAllSounds();state.view='stress';state.stressSub='menu';renderApp()">🫧 ${t('quickStress')}</button>
    </div>`;
}

async function maybeForceTest(){

  const remain = await testLockRemaining();

  state.forceShown = true;

}

async function viewAssess(){
  const as = await fetchAssessments();
  const f = state.filter || 'newest';
  let sorted = [...as];
  if(f==='newest') sorted.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  else if(f==='oldest') sorted.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  else if(f==='high'){ const ord={unhealthy:3,normal:2,healthy:1}; sorted.sort((a,b)=>(ord[b.level]||0)-(ord[a.level]||0)); }
  else if(f==='low'){ const ord={unhealthy:3,normal:2,healthy:1}; sorted.sort((a,b)=>(ord[a.level]||0)-(ord[b.level]||0)); }
  $('appmain').innerHTML = `
    <h1 class="page-title">${t('assessTitle')}</h1><p class="page-sub">${t('assessSub')}</p>
    <div class="card" style="padding:12px 16px">
      <label style="font-size:11.5px;color:var(--muted);font-weight:700">${t('filterTitle')}</label>
      <select id="filtSel" style="margin-top:6px;padding:10px;border-radius:10px;background:rgba(11,18,32,.6);border:1px solid var(--line);color:var(--text);width:100%">
        <option value="newest" ${f==='newest'?'selected':''}>${t('filterNewest')}</option>
        <option value="oldest" ${f==='oldest'?'selected':''}>${t('filterOldest')}</option>
        <option value="high" ${f==='high'?'selected':''}>${t('filterHighLevel')}</option>
        <option value="low" ${f==='low'?'selected':''}>${t('filterLowLevel')}</option>
      </select>
    </div>
    ${sorted.length ? `<div class="table-wrap"><table><thead><tr><th>${t('colName')}</th><th>${t('colClass')}</th><th>${t('colScore')}</th><th>${t('colDate')}</th></tr></thead><tbody>${sorted.map(a=>{ const lvl = a.level||'normal'; return `<tr><td style="font-weight:700;color:var(--text)">${esc(a.student_name)}</td><td>${esc(a.class_name||'—')}</td><td><span class="badge ${lvl}">${lvl==='healthy'?t('levelHealthy'):lvl==='unhealthy'?t('levelUnhealthy'):t('levelNormal')}</span></td><td style="color:var(--dim);font-size:12px">${new Date(a.created_at).toLocaleString()}</td></tr>`; }).join('')}</tbody></table></div>` : emptyBox('🧠', t('noAssess'))}`;
  $('filtSel').onchange = ()=>{ state.filter = $('filtSel').value; renderApp(); };
}

async function viewInbox(){
  const msgs = await fetchMessages();
  const receipts = await fetchReceipts();
  const {data:allLikes} = await sb.from('message_receipts').select('message_id, liked_at').not('liked_at', 'is', null);
  const likeCount = {};
  (allLikes||[]).forEach(x => { likeCount[x.message_id] = (likeCount[x.message_id]||0)+1; });
  const receiptMap = {};
  receipts.forEach(r => receiptMap[r.message_id] = r);
  const myClass = state.user.className || '';
  const isAdmin = state.user.role === 'admin';

  const filterMsg = (m, mode) => {
    const rc = receiptMap[m.id];
    const isRead = rc && rc.read_at;
    if(mode === 'inbox' && isRead) return false;
    if(mode === 'trash' && !isRead) return false;
    if(m.target_type === 'all') return true;
    if(m.target_type === 'teachers' && (state.user.role==='teacher' || state.user.role==='admin')) return true;
    if(m.target_type === 'students' && state.user.role==='student') return true;
    if(m.target_type === 'class' && myClass && m.target_value === myClass) return true;
    if(m.target_type === 'user' && m.target_value === state.user.id) return true;
    return false;
  };
  const mode = state.inboxTab || 'inbox';
  const visible = msgs.filter(m => filterMsg(m, mode));

  const renderCard = m => {
    const rc = receiptMap[m.id];
    const unread = !rc || !rc.read_at;
    const liked = rc && rc.liked_at;
    const likes = likeCount[m.id] || 0;
    const delBtn = isAdmin ? `<button class="icon-btn" style="width:28px;height:28px;font-size:13px" onclick="event.stopPropagation();deleteMessage('${m.id}','${esc(m.title).replace(/'/g,"\\'")}')">🗑</button>` : '';
    return `<div class="msg-card ${unread && mode==='inbox' ?'unread':''}">
      <div class="title" style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span style="flex:1">${esc(m.title)}</span>${delBtn}
      </div>
      <div class="meta"><span>👤 ${esc(m.sender_name||'Admin')}</span><span>🕒 ${new Date(m.created_at).toLocaleString()}</span></div>
      <div class="preview">${esc((m.body||'').slice(0,140))}</div>
      <div class="actions">
        <button class="like-btn ${liked?'on':''}" onclick="event.stopPropagation();likeMessage('${m.id}')">❤️ ${likes}</button>
        <button class="view-btn" onclick="event.stopPropagation();openMessage('${m.id}')">📖 ${t('view')}</button>
      </div>
    </div>`;
  };

  $('appmain').innerHTML = `
    <h1 class="page-title">${t('inboxTitle')}</h1><p class="page-sub">${t('inboxSub')}</p>
    <div class="auth-tabs" style="margin-bottom:14px;max-width:300px">
      <button class="${mode==='inbox'?'on':''}" onclick="state.inboxTab='inbox';renderApp()">📥 ${t('inboxTitle')}</button>
      <button class="${mode==='trash'?'on':''}" onclick="state.inboxTab='trash';renderApp()">🗑 ${t('trashTitle')}</button>
    </div>
    ${visible.length ? visible.map(renderCard).join('') : emptyBox('📥','—')}`;
}

async function openMessage(id){
  const {data:m} = await sb.from('messages').select('*').eq('id', id).single();
  if(!m) return;
  const {data:rc} = await sb.from('message_receipts').select('*').eq('message_id', id).eq('user_id', state.user.id).maybeSingle();
  if(!rc) await sb.from('message_receipts').insert({message_id: id, user_id: state.user.id, read_at: new Date().toISOString()});
  else if(!rc.read_at) await sb.from('message_receipts').update({read_at: new Date().toISOString()}).eq('id', rc.id);
  await refreshUnread();
  const media = m.media_url ? (m.media_type==='video'?`<video src="${m.media_url}" controls style="width:100%;border-radius:12px;margin-top:12px"></video>`:m.media_type==='image'?`<img src="${m.media_url}" style="width:100%;border-radius:12px;margin-top:12px">`:`<a href="${m.media_url}" target="_blank" style="color:var(--primary2)">Attachment</a>`) : '';
  openModal(`
    <button class="btn btn-ghost" style="margin-bottom:14px" onclick="closeModal()">← ${t('close')}</button>
    <h2 style="margin:0 0 6px">${esc(m.title)}</h2>
    <div style="font-size:12px;color:var(--muted);margin:6px 0 14px">👤 ${esc(m.sender_name||'Admin')} · ${new Date(m.created_at).toLocaleString()}</div>
    <div style="font-size:14px;color:var(--muted);white-space:pre-wrap;line-height:1.7">${esc(m.body||'')}</div>
    ${media}
    <div style="display:flex;justify-content:flex-end;margin-top:20px">
      <button class="btn btn-primary" onclick="closeModal()">${t('close')}</button>
    </div>`);
}
async function likeMessage(id){
  const {data:rc} = await sb.from('message_receipts').select('*').eq('message_id', id).eq('user_id', state.user.id).maybeSingle();
  if(rc){ await sb.from('message_receipts').update({liked_at: rc.liked_at ? null : new Date().toISOString()}).eq('id', rc.id); }
  else { await sb.from('message_receipts').insert({message_id: id, user_id: state.user.id, liked_at: new Date().toISOString()}); }
  renderApp();
}

function stopAllSounds(){
  document.querySelectorAll('.sound-btn').forEach(b=>b.classList.remove('active'));
  if(state.activeSound){
    try{
      if(state.activeSound.stop) state.activeSound.stop();
      if(state.activeSound.src) state.activeSound.src.stop();
    }catch(e){}
    state.activeSound = null;
  }
}
function playRain(el){
  stopAllSounds(); el.classList.add('active');
  const ctx = getAudioCtx();
  const bufferSize = ctx.sampleRate * 5;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  let b0=0,b1=0,b2=0;
  for(let i=0;i<bufferSize;i++){
    const white = Math.random()*2-1;
    b0 = 0.99*b0 + 0.05*white;
    b1 = 0.96*b1 + 0.12*white;
    b2 = 0.85*b2 + 0.25*white;
    data[i] = (b0 + b1 + b2) * 0.14;
  }
  const src = ctx.createBufferSource(); src.buffer = buffer; src.loop = true;
  const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 2200;
  const gain = ctx.createGain(); gain.gain.value = 0.4;
  src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  src.start();
  state.activeSound = { stop: ()=>{ try{src.stop();}catch(e){} } };
}
function playForest(el){
  stopAllSounds(); el.classList.add('active');
  const ctx = getAudioCtx();
  const bufferSize = ctx.sampleRate * 6;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){
    const t = i/ctx.sampleRate;
    const wind = (Math.random()*2-1) * 0.15 * (0.5 + 0.5*Math.sin(t*0.7));
    const birds = Math.sin(t*3200)*Math.exp(-((t%3)*3))*0.04 + Math.sin(t*2800)*Math.exp(-((t%4.2)*2))*0.03;
    data[i] = wind + birds;
  }
  const src = ctx.createBufferSource(); src.buffer = buffer; src.loop = true;
  const filter = ctx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 1200; filter.Q.value = 0.5;
  const gain = ctx.createGain(); gain.gain.value = 0.35;
  src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  src.start();
  state.activeSound = { stop: ()=>{ try{src.stop();}catch(e){} } };
}
function playBowl(el){
  stopAllSounds(); el.classList.add('active');
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  const freqs = [110, 220, 330, 440, 550];
  const oscs = [];
  freqs.forEach((f,i)=>{
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = f;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.05/(i+1), now + 0.6);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 8);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 8.5);
    oscs.push(osc);
  });
  state.activeSound = { stop: ()=>{ oscs.forEach(o=>{ try{o.stop();}catch(e){} }); } };
  setTimeout(()=>{
    if(state.stressSub==='sound' && el.classList.contains('active')) playBowl(el);
  }, 8000);
}
function playBreeze(el){
  stopAllSounds(); el.classList.add('active');
  const ctx = getAudioCtx();
  const bufferSize = ctx.sampleRate * 8;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  let last = 0;
  for(let i=0;i<bufferSize;i++){
    const t = i/ctx.sampleRate;
    const white = Math.random()*2-1;
    last = last*0.9 + white*0.1;
    data[i] = last * (0.3 + 0.5*Math.sin(t*0.5));
  }
  const src = ctx.createBufferSource(); src.buffer = buffer; src.loop = true;
  const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 900;
  const gain = ctx.createGain(); gain.gain.value = 0.35;
  src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  src.start();
  state.activeSound = { stop: ()=>{ try{src.stop();}catch(e){} } };
}

function spawnBubble(){
  const stage = $('bubbleStage'); if(!stage) return;

  const dur = 10 + Math.random()*6;

async function popBubble(b){
  if(b.dataset.popped) return;
  b.dataset.popped = '1';
  const rect = b.getBoundingClientRect();
  const stageRect = $('bubbleStage').getBoundingClientRect();
  const x = rect.left - stageRect.left;
  const y = rect.top - stageRect.top;
  b.style.transform = 'scale(0)';
  b.style.opacity = '0';
  playPopSound();
  const ph = document.createElement('div');
  ph.className = 'bubble-pop';
  ph.style.left = Math.max(10, Math.min(x - 80, stageRect.width - 280)) + 'px';
  ph.style.top = Math.max(10, y - 40) + 'px';
  ph.textContent = '✨';
  $('bubbleStage').appendChild(ph);
  const usedSnapshot = state.usedBubbles.slice();
  try{
    const r = await fetch(SUPABASE_URL + '/functions/v1/' + FN_BUBBLE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lang: state.lang, used: usedSnapshot })
    });
    const d = await r.json();
    let text = d.text || t('encouragement');
    if(usedSnapshot.includes(text)){
      const pool = {
        zh:['你不孤单，你很重要。','被霸凌不是你的错。','照顾好自己，你很棒。','说出来就是勇敢。','你值得被温柔对待。','你的感受都很真实。','今天也要好好爱自己。','你比你想象的更坚强。','没人有权让你受伤。','深呼吸，一切会好。'],
        en:['You are not alone.','It is not your fault.','Take care of yourself.','Speaking up is brave.','You deserve kindness.','Your feelings are real.','Love yourself today.','You are stronger than you think.','No one has the right to hurt you.','Breathe. It will pass.'],
        ms:['Anda tidak keseorangan.','Ini bukan salah anda.','Jaga diri anda.','Bersuara itu berani.','Anda layak dihargai.','Perasaan anda nyata.','Sayangi diri hari ini.','Anda lebih kuat dari sangkaan.','Tiada siapa boleh sakiti anda.','Bernafas. Ia akan berlalu.']
      }[state.lang];
      const unused = pool.filter(x => !usedSnapshot.includes(x));
      text = (unused.length ? unused : pool)[Math.floor(Math.random() * (unused.length || pool.length))];
    }
    ph.textContent = text;
    state.usedBubbles.push(text);
    if(state.usedBubbles.length > 50) state.usedBubbles = state.usedBubbles.slice(-30);
  } catch(e){ ph.textContent = t('encouragement'); }
  setTimeout(()=>{ if(ph.parentNode) ph.remove(); }, 3500);
  setTimeout(()=>{ if(b.parentNode) b.remove(); }, 200);
}
function playPopSound(){
  try{
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1000, now);
    osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.16);
  }catch(e){}
}

    p += 6 + Math.random()*8;
    if(p > 100) p = 100;
    if(bar) bar.style.width = p + '%';
    if(p >= 100) clearInterval(iv);
  }, 120);

  const tryPlay = ()=>{ playSplashSound(); document.removeEventListener('click', tryPlay); document.removeEventListener('touchstart', tryPlay); };
  document.addEventListener('click', tryPlay);
  document.addEventListener('touchstart', tryPlay);
  setTimeout(()=>{ tryPlay(); }, 500);

  const splashDelay = new Promise(r=>setTimeout(r, 2400));
  const sessionCheck = (async()=>{
    try{
      const {data:{session}} = await sb.auth.getSession();
      if(!session) return null;
      const {data:prof} = await sb.from('profiles').select('*').eq('id', session.user.id).single();
      return prof;
    }catch(e){ return null; }
  })();

  const [, prof] = await Promise.all([splashDelay, sessionCheck]);
  if(prof){
    const {data:app} = await sb.from('teacher_applications').select('*').eq('user_id', prof.id).order('created_at',{ascending:false}).limit(1).maybeSingle();
    if(app && (app.status === 'pending' || app.status === 'rejected' || app.status === 'blocked')){
      await sb.auth.signOut();
      showScreen('auth'); renderAuth(); return;
    }
    state.user = {id:prof.id, name:prof.name, email:prof.email, role:prof.role, className:prof.class_name, avatar_url:prof.avatar_url, gender:prof.gender, race:prof.race, birthday:prof.birthday};
    await refreshUnread();
    if(!localStorage.getItem('vs_lang_picked')) showLangPicker(); else await enterApp();
  } else {
    showScreen('auth'); renderAuth();
  }
}
boot();
</script>
</body>
</html>
