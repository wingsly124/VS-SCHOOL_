<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vs School · SMK MERBAU</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--panel:rgba(18,32,64,.72);--line:rgba(90,140,220,.22);--text:#e8f1ff;--muted:#8fa6c8;--dim:#5f7a9e;--accent:#2f7bff;--accent2:#22d3ee}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;background:#050b1a;color:var(--text);line-height:1.6;font-size:15px;min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 600px at 10% -10%,rgba(47,123,255,.18),transparent 60%),radial-gradient(700px 500px at 100% 0%,rgba(34,211,238,.10),transparent 55%),linear-gradient(160deg,#050b1a,#081326 55%,#050b1a)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
.screen{display:none;min-height:100vh}.screen.active{display:block}
#scr-splash{display:none;place-items:center;min-height:100vh;text-align:center}
#scr-splash.active{display:grid}
.splash-logo{font-size:64px;animation:pop .8s}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.splash-title{font-size:44px;font-weight:800;letter-spacing:-1.5px;margin:10px 0 0;background:linear-gradient(120deg,#fff,#7fb0ff 60%,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.splash-sub{font-size:13px;letter-spacing:4px;color:var(--accent2);margin-top:6px;font-weight:700}
.splash-cn{font-size:17px;color:#9fc5ff;margin-top:6px}
.splash-school{font-size:12px;letter-spacing:2px;color:var(--muted);margin-top:22px;padding:6px 14px;border:1px solid var(--line);border-radius:99px;display:inline-block}
.spinner{width:30px;height:30px;border:3px solid rgba(90,140,220,.2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:34px auto 0}
@keyframes spin{to{transform:rotate(360deg)}}
.splash-studio{font-size:11px;color:var(--dim);letter-spacing:2px;margin-top:16px}
.auth-lang{position:fixed;top:14px;right:14px;z-index:50;display:flex;gap:5px;background:rgba(8,18,38,.8);padding:4px;border-radius:11px;border:1px solid var(--line);backdrop-filter:blur(12px)}
.auth-lang button{padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.auth-lang button.on{background:linear-gradient(135deg,rgba(47,123,255,.35),rgba(34,211,238,.2));color:#fff}
.auth-wrap{display:flex;min-height:100vh;max-width:1200px;margin:0 auto}
.auth-brand{flex:1;padding:60px 48px;display:flex;flex-direction:column;justify-content:center}
.auth-brand .b-logo{font-size:52px}
.auth-brand h1{font-size:40px;font-weight:800;letter-spacing:-1.5px;margin:12px 0 0;background:linear-gradient(120deg,#fff,#7fb0ff 60%,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-brand .b-sub{font-size:12px;letter-spacing:3px;color:var(--accent2);font-weight:700;margin-top:4px}
.auth-brand .b-cn{font-size:16px;color:#9fc5ff;margin-top:6px}
.auth-brand ul{list-style:none;padding:0;margin:32px 0 0}
.auth-brand li{padding:13px 0;border-bottom:1px solid var(--line);color:#c3d4ec;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.auth-brand li::before{content:'▸';color:var(--accent2);font-weight:800}
.auth-form{flex:1;padding:60px 48px;display:flex;flex-direction:column;justify-content:center;max-width:520px;margin:0 auto;width:100%}
.auth-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;backdrop-filter:blur(14px)}
.auth-tabs{display:flex;gap:6px;background:rgba(8,18,38,.7);padding:5px;border-radius:12px;margin-bottom:22px}
.auth-tabs button{flex:1;padding:10px;border-radius:9px;font-size:14px;font-weight:700;color:var(--muted)}
.auth-tabs button.on{background:linear-gradient(135deg,#2f7bff,#22d3ee);color:#fff;box-shadow:0 4px 14px rgba(47,123,255,.35)}
.field{margin-bottom:14px;position:relative}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;background:rgba(8,18,38,.85);border:1px solid var(--line);color:var(--text);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,123,255,.18)}
.field textarea{resize:vertical;min-height:96px}
.pwd-wrap{position:relative}
.pwd-wrap input{padding-right:46px}
.pwd-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;display:grid;place-items:center;font-size:16px;color:var(--muted);cursor:pointer;border-radius:8px}
.pwd-eye:hover{background:rgba(90,140,220,.15);color:#fff}
.pwd-strength{height:4px;background:rgba(90,140,220,.15);border-radius:99px;margin-top:6px;overflow:hidden}
.pwd-strength i{display:block;height:100%;transition:width .3s,background .3s;width:0}
.pwd-hint{font-size:11px;color:var(--dim);margin-top:4px}
.btn{padding:13px 20px;border-radius:12px;font-size:14.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s}
.btn-primary{background:linear-gradient(135deg,#2f7bff,#22d3ee);color:#fff;box-shadow:0 6px 20px rgba(47,123,255,.3)}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-ghost{background:rgba(90,140,220,.1);border:1px solid var(--line);color:var(--text)}
.btn-ghost:hover{background:rgba(90,140,220,.2)}
.btn-danger{background:rgba(255,84,112,.14);border:1px solid rgba(255,84,112,.4);color:#ff8fa3}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn-full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.verify-box{background:rgba(8,18,38,.7);border:1px dashed rgba(90,140,220,.35);border-radius:12px;padding:14px;margin-bottom:14px}
.verify-box .v-title{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}
.verify-box .v-row{display:flex;gap:10px;align-items:center}
.verify-box .v-q{flex:1;font-size:16px;font-weight:800;color:var(--accent2);background:rgba(34,211,238,.08);padding:9px 12px;border-radius:9px;text-align:center}
.verify-box input{width:90px;text-align:center;font-weight:800}
.err{font-size:12.5px;color:#ff8fa3;margin-top:8px;min-height:17px}
.hint{font-size:11.5px;color:var(--dim);margin-top:14px;line-height:1.6;text-align:center}
.link{font-size:13px;color:var(--accent2);cursor:pointer;text-decoration:underline;margin-top:10px;display:inline-block}
.link:hover{color:#fff}
.role-pick{display:flex;gap:10px}
.role-pick button{flex:1;padding:14px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(8,18,38,.6);font-size:13.5px;font-weight:700;color:var(--muted)}
.role-pick button.on{border-color:var(--accent);background:rgba(47,123,255,.16);color:#fff}
.role-pick button:disabled{opacity:.35;cursor:not-allowed}
.role-pick .sub{display:block;font-size:10.5px;font-weight:500;margin-top:3px;color:var(--dim)}
.appbar{position:sticky;top:0;z-index:40;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(6,14,30,.86);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.appbar-left{display:flex;align-items:center;gap:11px}
.appbar-left .logo{font-size:23px}
.app-name{font-size:15.5px;font-weight:800;line-height:1.15}
.app-school{font-size:10px;letter-spacing:1.6px;color:var(--dim);font-weight:700}
.appbar-right{display:flex;align-items:center;gap:9px}
.lang-mini{display:flex;gap:3px;background:rgba(8,18,38,.7);padding:3px;border-radius:9px;border:1px solid var(--line)}
.lang-mini button{padding:5px 9px;border-radius:7px;font-size:11px;font-weight:700;color:var(--muted)}
.lang-mini button.on{background:rgba(47,123,255,.3);color:#fff}
.user-chip{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;background:rgba(47,123,255,.12);border:1px solid rgba(47,123,255,.3);font-size:12.5px;font-weight:700;max-width:180px}
.user-chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-chip .rl{font-size:10px;padding:1px 7px;border-radius:99px;background:rgba(34,211,238,.2);color:#7fe7f7;flex-shrink:0}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(90,140,220,.1);border:1px solid var(--line);font-size:15px;position:relative}
.icon-btn:hover{background:rgba(90,140,220,.24)}
.dot-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;background:#ff5470;color:#fff;font-size:10px;font-weight:800;border-radius:99px;display:flex;align-items:center;justify-content:center}
.app-body{display:flex;min-height:calc(100vh - 60px)}
.appnav{width:222px;flex-shrink:0;padding:16px 12px;border-right:1px solid var(--line);background:rgba(6,14,30,.45)}
.appnav a{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:11px;color:#a9bdd8;font-size:13.5px;font-weight:600;margin-bottom:3px;cursor:pointer;border:1px solid transparent}
.appnav a:hover{background:rgba(90,140,220,.12);color:#fff}
.appnav a.on{background:linear-gradient(135deg,rgba(47,123,255,.28),rgba(34,211,238,.14));color:#fff;border-color:rgba(47,123,255,.4)}
.appmain{flex:1;padding:26px 30px;max-width:1080px;min-width:0}
@media(max-width:800px){.app-body{flex-direction:column}.appnav{width:100%;display:flex;overflow-x:auto;gap:6px;padding:10px;border-right:none;border-bottom:1px solid var(--line)}.appnav a{white-space:nowrap;margin:0;padding:9px 13px;font-size:12.5px}.appmain{padding:18px 15px}.app-school{display:none}.user-chip{max-width:120px}.auth-brand{display:none}.auth-form{padding:80px 20px 40px;max-width:100%}}
.page-title{font-size:25px;font-weight:800;letter-spacing:-.6px;margin:0 0 4px}
.page-sub{font-size:13px;color:var(--muted);margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;backdrop-filter:blur(10px);margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:15px;font-weight:800;color:#cfe0ff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(10px)}
.stat .n{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:600}
.stat.blue .n{color:#7fb0ff}.stat.yellow .n{color:#ffc76b}.stat.green .n{color:#66e29a}.stat.red .n{color:#ff8fa3}
.hero{background:linear-gradient(135deg,rgba(47,123,255,.2),rgba(34,211,238,.08));border:1px solid rgba(47,123,255,.3);border-radius:18px;padding:22px;margin-bottom:18px}
.hero h2{margin:0 0 6px;font-size:20px;font-weight:800}
.hero p{margin:0 0 14px;font-size:13.5px;color:#c3d4ec}
.quick{display:flex;gap:9px;flex-wrap:wrap}
.quick button{padding:10px 16px;border-radius:11px;font-size:13px;font-weight:700;background:rgba(8,18,38,.7);border:1px solid var(--line)}
.quick button:hover{border-color:var(--accent);background:rgba(47,123,255,.15)}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700}
.badge.pending{background:rgba(255,176,32,.18);color:#ffc76b}
.badge.review{background:rgba(47,123,255,.2);color:#7fb0ff}
.badge.resolved{background:rgba(34,197,94,.18);color:#66e29a}
.badge.closed{background:rgba(143,166,200,.18);color:#a9bdd8}
.badge.low{background:rgba(34,197,94,.16);color:#66e29a}
.badge.mid{background:rgba(255,176,32,.16);color:#ffc76b}
.badge.high{background:rgba(255,84,112,.18);color:#ff8fa3}
.badge.critical{background:rgba(255,84,112,.3);color:#ffb3c1}
.badge.info{background:rgba(34,211,238,.18);color:#7fe7f7}
.badge.approved{background:rgba(34,197,94,.2);color:#66e29a}
.badge.rejected{background:rgba(255,84,112,.2);color:#ff8fa3}
.badge.blocked{background:rgba(143,166,200,.25);color:#a9bdd8}
.badge.very_low{background:rgba(34,197,94,.22);color:#66e29a}
.badge.very_high{background:rgba(255,84,112,.35);color:#ffb3c1}
.empty{text-align:center;padding:44px 20px;color:var(--dim);font-size:13.5px}
.empty .ic{font-size:42px;display:block;margin-bottom:12px;opacity:.5}
.list-item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:11px;cursor:pointer;transition:.16s}
.list-item:hover{border-color:rgba(47,123,255,.45);transform:translateY(-1px)}
.li-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.li-code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--accent2);font-weight:700}
.li-desc{font-size:13.5px;color:#c3d4ec;margin-bottom:8px;line-height:1.6}
.li-meta{font-size:11.5px;color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--line);background:rgba(8,18,38,.6)}
td{padding:11px 12px;border-bottom:1px solid rgba(90,140,220,.09);color:#c3d4ec}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(47,123,255,.05)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:400px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.chat-head{padding:14px 18px;border-bottom:1px solid var(--line);background:rgba(8,18,38,.6);display:flex;justify-content:space-between;align-items:center}
.chat-head h3{margin:0;font-size:15px;font-weight:800}
.chat-head p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.chat-badge{font-size:10px;padding:3px 8px;border-radius:99px;background:rgba(34,211,238,.15);color:#7fe7f7;font-weight:700}
.chat-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:82%;padding:12px 15px;border-radius:16px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg.ai{align-self:flex-start;background:rgba(47,123,255,.13);border:1px solid rgba(47,123,255,.25);border-bottom-left-radius:5px}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,rgba(47,123,255,.9),rgba(34,211,238,.75));color:#fff;border-bottom-right-radius:5px}
.msg.crisis{align-self:flex-start;background:rgba(255,84,112,.16);border:1px solid rgba(255,84,112,.5);border-bottom-left-radius:5px;color:#ffd5dd}
.chat-input{display:flex;gap:9px;padding:13px;border-top:1px solid var(--line);background:rgba(8,18,38,.6)}
.chat-input input{flex:1;padding:12px 15px;border-radius:12px;background:rgba(8,18,38,.9);border:1px solid var(--line);color:var(--text);outline:none}
.chat-input input:focus{border-color:var(--accent)}
.chat-input button{padding:0 20px;border-radius:12px;background:linear-gradient(135deg,#2f7bff,#22d3ee);color:#fff;font-weight:700;font-size:14px}
.typing{align-self:flex-start;padding:12px 18px;color:var(--muted);font-size:13px;letter-spacing:3px}
.suggest{display:flex;gap:7px;flex-wrap:wrap;padding:0 13px 13px}
.suggest button{padding:7px 13px;border-radius:99px;font-size:12px;background:rgba(90,140,220,.1);border:1px solid var(--line);color:#a9bdd8}
.suggest button:hover{border-color:var(--accent);color:#fff}
.modal{position:fixed;inset:0;background:rgba(3,7,16,.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:200;padding:18px}
.modal.on{display:flex}
.modal-box{background:#0d1a33;border:1px solid var(--line);border-radius:18px;padding:24px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto}
.modal-box h2{margin:0 0 6px;font-size:20px;font-weight:800}
.modal-close{position:absolute;top:14px;right:14px}
.test-prog{height:6px;background:rgba(90,140,220,.15);border-radius:99px;overflow:hidden;margin-bottom:8px}
.test-prog i{display:block;height:100%;background:linear-gradient(90deg,#2f7bff,#22d3ee);transition:width .35s;border-radius:99px}
.opt{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border-radius:13px;background:rgba(8,18,38,.7);border:1px solid var(--line);margin-bottom:12px;cursor:pointer;font-size:15px;line-height:1.5;min-height:56px;transition:.16s;width:100%}
.opt:hover{border-color:rgba(47,123,255,.5);background:rgba(47,123,255,.08)}
.opt.on{border-color:var(--accent);background:rgba(47,123,255,.18);font-weight:700}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(90,140,220,.5);flex-shrink:0;margin-top:4px}
.opt.on .dot{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px #0d1a33}
.opt span:last-child{flex:1;word-break:break-word}
.dim-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(90,140,220,.08)}
.dim-row:last-child{border-bottom:none}
.dim-name{flex:1;font-size:13.5px}
.dim-bar{width:64px;height:7px;background:rgba(90,140,220,.15);border-radius:99px;overflow:hidden;flex-shrink:0}
.dim-bar i{display:block;height:100%;border-radius:99px}
.score-card{border-radius:18px;padding:24px;margin-bottom:18px}
.score-big{font-size:46px;font-weight:800;letter-spacing:-2px;line-height:1}
.score-big small{font-size:18px;color:rgba(255,255,255,.45);font-weight:600}
.lock-card{text-align:center;padding:36px 26px;max-width:460px;margin:40px auto}
.lock-card .ic{font-size:48px;margin-bottom:14px;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}
.countdown{font-size:26px;font-weight:800;font-family:ui-monospace,Menlo,monospace;color:var(--accent);margin:12px 0}
.lang-pick-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.lang-pick-box{max-width:480px;width:100%;text-align:center}
.lang-pick-box .globe{font-size:56px;margin-bottom:16px}
.lang-pick-box h1{font-size:26px;font-weight:800;margin:0 0 6px}
.lang-pick-box .sub{font-size:14px;color:var(--muted);margin:0 0 32px}
.lang-pick-box .opts{display:flex;flex-direction:column;gap:12px}
.lang-pick-box .opts button{padding:18px;font-size:16px}
.lang-pick-box .note{font-size:12px;color:var(--dim);margin-top:24px}
.stars{display:flex;gap:6px}
.stars span{font-size:26px;cursor:pointer;opacity:.35;transition:.15s}
.stars span.on{opacity:1;transform:scale(1.05)}
.participant-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.participant-row input{padding:10px 12px;font-size:14px;border-radius:10px;background:rgba(8,18,38,.85);border:1px solid var(--line);color:var(--text);outline:none}
.participant-row input:focus{border-color:var(--accent)}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:10px}
.media-thumb{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:rgba(8,18,38,.6);border:1px solid var(--line)}
.media-thumb img,.media-thumb video{width:100%;height:100%;object-fit:cover}
.media-thumb .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;background:rgba(0,0,0,.7);border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;cursor:pointer}
.msg-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;transition:.15s}
.msg-card:hover{border-color:rgba(47,123,255,.5)}
.msg-card.unread{border-left:3px solid var(--accent2);background:rgba(34,211,238,.05)}
.msg-card .title{font-size:15px;font-weight:800;margin-bottom:6px}

function isValidFullName(name){
  if(!name || name.length < 5) return false;
  if(name !== name.toUpperCase()) return false;
  if(!/^[A-Z][A-Z\s.']*$/.test(name)) return false;
  const words = name.trim().split(/\s+/).filter(w => w.replace(/[.']/g,'').length >= 2);
  if(words.length < 2) return false;
  if(/(.)\1{3,}/.test(name)) return false;
  if(/^[A-Z]{5,}$/.test(name.replace(/\s/g,'')) && words.length === 1) return false;
  if(name.replace(/\s/g,'').length > 20 && !name.includes(' ')) return false;
  return true;
}
function pwdStrength(p){
  let s = 0;
  if(p.length >= 8) s++;
  if(/[A-Z]/.test(p)) s++;
  if(/[a-z]/.test(p)) s++;
  if(/[0-9]/.test(p)) s++;
  if(/[^A-Za-z0-9]/.test(p)) s++;
  return s;
}

function detectTopic(text){const s=String(text||'').toLowerCase();let best=null,bs=0;for(const tp of AI_TOPICS){let sc=0;for(const kw of tp.kw){if(s.includes(kw.toLowerCase()))sc+=kw.length>3?2:1.2;}if(sc>bs){bs=sc;best=tp;}}return bs>=1.2?best:null;}

async function aiRespond(text){

      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })

    let reply = null;
    try{ const p = JSON.parse(rawText); reply = p.reply || p.choices?.[0]?.message?.content || null; } catch(e){ reply = rawText; }

function generateTestLocal(){
  const opts = state.lang==='zh'?['完全没有','偶尔','经常','几乎每天']:state.lang==='ms'?['Langsung tidak','Kadang','Kerap','Hampir setiap hari']:['Not at all','Sometimes','Often','Almost every day'];

  for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]];}

function analyzeTest(qs, ans){
  const dims = qs.map((q,i)=>({dim:q.dim,name:q.name,score:ans[i]||0,max:3}));
  const total = dims.reduce((a,b)=>a+b.score,0);
  let level,label;
  if(total<=10){level='very_low';label=state.lang==='zh'?'极低':state.lang==='ms'?'Sangat rendah':'Very low';}
  else if(total<=22){level='low';label=state.lang==='zh'?'低':state.lang==='ms'?'Rendah':'Low';}
  else if(total<=35){level='mid';label=state.lang==='zh'?'中':state.lang==='ms'?'Sederhana':'Moderate';}
  else if(total<=48){level='high';label=state.lang==='zh'?'高':state.lang==='ms'?'Tinggi':'High';}
  else{level='very_high';label=state.lang==='zh'?'极高':state.lang==='ms'?'Sangat tinggi':'Very high';}
  dims.sort((a,b)=>b.score-a.score);
  return {total,max:60,level,label,dims,at:Date.now()};
}

    academic:{zh:'学业压力。每天定1个小目标。',en:'Academic stress. Set 1 small goal per day.',ms:'Tekanan akademik. Tetapkan 1 matlamat.'}

function showScreen(n){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); const el = $('scr-'+n); if(el) el.classList.add('active'); state.screen=n; window.scrollTo(0,0); }
function newVerify(){ return {a:Math.floor(Math.random()*8)+2,b:Math.floor(Math.random()*8)+2}; }
function pwdField(id, label, ph){ return `<div class="field"><label>${label}</label><div class="pwd-wrap"><input id="${id}" type="password" placeholder="${ph}" oninput="updatePwdBar('${id}','${id}_bar')"><span class="pwd-eye" data-target="${id}">👁</span></div><div class="pwd-strength" id="${id}_bar"><i></i></div><div class="pwd-hint">${t('pwdHint')}</div></div>`; }
function updatePwdBar(id, barId){
  const inp = document.getElementById(id); if(!inp) return;
  const s = pwdStrength(inp.value);
  const bar = document.getElementById(barId); if(!bar) return;
  const fill = bar.querySelector('i');
  let w = '0%', col = '#8fa6c8';
  if(s <= 2){ w = '33%'; col = '#ff5470'; }
  else if(s <= 3){ w = '66%'; col = '#ffb020'; }
  else { w = '100%'; col = '#22c55e'; }
  fill.style.width = w; fill.style.background = col;
}
function bindPwdEyes(){ document.querySelectorAll('.pwd-eye').forEach(el=>{ el.onclick = ()=>{ const inp = $(el.dataset.target); if(!inp) return; inp.type = inp.type === 'password' ? 'text' : 'password'; el.textContent = inp.type === 'password' ? '👁' : '🙈'; }; }); }

async function doLogin(){
  const email = ($('liEmail').value||'').trim().toLowerCase();
  const pwd = $('liPwd').value||'';
  const vv = ($('verifyInput').value||'').trim();
  const err = $('authErr'); const show = m => err.textContent = m;
  if(!email) return show(t('errEmail'));
  if(!email.endsWith('@gmail.com')) return show(t('errGmail'));
  if(!pwd) return show(t('errPwd'));
  if(vv !== String(state.verify.a+state.verify.b)){ state.verify=newVerify(); renderAuth(); return setTimeout(()=>{$('authErr').textContent=t('verifyWrong');},10); }
  show('Signing in…');
  const {data, error} = await sb.auth.signInWithPassword({email, password:pwd});
  if(error) return show(error.message);
  await new Promise(r=>setTimeout(r, 600));
  let {data:prof} = await sb.from('profiles').select('*').eq('id', data.user.id).maybeSingle();
  if(!prof){
    const {data:created} = await sb.from('profiles').insert({id:data.user.id, email:email, name:email.split('@')[0].toUpperCase(), role:'student', class_name:''}).select().single();
    if(created) prof = created;
  }
  if(!prof) return show('Profile not found. Contact admin.');
  if(prof.role === 'teacher'){
    const {data:app} = await sb.from('teacher_applications').select('*').eq('user_id', prof.id).order('created_at',{ascending:false}).limit(1).maybeSingle();
    if(app){
      if(app.status === 'pending'){ await sb.auth.signOut(); return show(t('teacherPending')); }
      if(app.status === 'rejected'){ await sb.auth.signOut(); return show(t('teacherRejected')); }
      if(app.status === 'blocked'){ await sb.auth.signOut(); return show(t('teacherBlocked')); }
    }
  }
  state.user = {id:prof.id, name:prof.name, email:prof.email, role:prof.role, className:prof.class_name, classes:prof.classes || []};
  await refreshUnread();
  if(!localStorage.getItem('vs_lang_picked')) showLangPicker(); else await enterApp();
}

async function doRegister(){
  const name = ($('rgName').value||'').trim().toUpperCase();
  const email = ($('rgEmail').value||'').trim().toLowerCase();
  const pwd = $('rgPwd').value||'';
  const pwd2 = $('rgPwd2').value||'';
  const vv = ($('verifyInput').value||'').trim();
  const err = $('authErr'); const show = m => err.textContent = m;
  if(!name) return show(t('errName'));
  if(!isValidFullName(name)) return show(t('errNameFormat') + ' ' + t('errNameSilly'));
  if(!email) return show(t('errEmail'));
  if(!email.endsWith('@gmail.com')) return show(t('errGmail'));
  if(pwd.length<8) return show(t('errPwdLen'));
  if(!/[A-Z]/.test(pwd)) return show(t('errPwdUpper'));
  if(!/[a-z]/.test(pwd)) return show(t('errPwdLower'));
  if(!/[0-9]/.test(pwd)) return show(t('errPwdNum'));
  if(pwd!==pwd2) return show(t('errPwdMatch'));

  let cls = '';
  if(state.role === 'student'){
    const f = $('rgForm').value;
    if(!f) return show(t('errForm'));
    if(f === 'PERALIHAN') cls = 'PERALIHAN';
    else {
      const s = $('rgClass').value;
      if(!s) return show(t('errClass'));
      cls = f + ' ' + s;
    }
  }
  if(vv !== String(state.verify.a+state.verify.b)){ state.verify=newVerify(); renderAuth(); return setTimeout(()=>{$('authErr').textContent=t('verifyWrong');},10); }

  show('Creating account…');
  const {data, error} = await sb.auth.signUp({email, password:pwd, options:{data:{name, role:'student', class_name:cls}}});
  if(error){ if(error.message.toLowerCase().includes('already')) return show(t('errExists')); return show(error.message); }
  if(!data.user) return show('Sign up failed.');
  if(!data.session) return show('Registered. Please confirm email.');

  if(state.role === 'teacher'){
    const {error: pErr} = await sb.from('profiles').upsert({id: data.user.id, email, name, role:'student', class_name:''}, {onConflict:'id'});
    if(pErr) console.warn(pErr);
    await sb.from('teacher_applications').insert({user_id: data.user.id, email, name, status:'pending'});
    await sb.auth.signOut();
    alert(t('teacherApplied'));
    state.authTab = 'login';
    renderAuth();
    return;
  }

  const {error: pErr} = await sb.from('profiles').upsert({id: data.user.id, email, name, role:'student', class_name:cls, preferred_language:'en'}, {onConflict:'id'});
  if(pErr) console.warn(pErr);
  let {data:prof} = await sb.from('profiles').select('*').eq('id', data.user.id).maybeSingle();
  if(!prof) return show('Profile creation failed.');
  state.user = {id:prof.id, name:prof.name, email:prof.email, role:prof.role, className:prof.class_name};
  await refreshUnread();
  if(!localStorage.getItem('vs_lang_picked')) showLangPicker(); else await enterApp();
}

async function doLogout(){
  await sb.auth.signOut();
  localStorage.removeItem('vs_lang_picked');

async function startTest(){

function renderTestQ(){

  $('opts').querySelectorAll('.opt').forEach(el=>{ el.onclick = ()=>{ T.answers[T.index] = parseInt(el.dataset.i,10); renderTestQ(); }; });

  const pending = rs.filter(r=>r.status==='pending').length;
  const done = rs.filter(r=>r.status==='resolved').length;
  $('appmain').innerHTML = `<h1 class="page-title">${t('dashTitle')}</h1><p class="page-sub">${t('dashSub')}</p><div class="stats"><div class="stat blue"><div class="n">${students.length}</div><div class="l">${t('navStudents')}</div></div><div class="stat yellow"><div class="n">${pending}</div><div class="l">${t('statPending')}</div></div><div class="stat green"><div class="n">${done}</div><div class="l">${t('statResolved')}</div></div><div class="stat red"><div class="n">${as.length}</div><div class="l">${t('navAssess')}</div></div></div><div class="card"><h3>${t('recent')}</h3>${rs.length ? rs.slice(0,5).map(r=>`<div style="padding:10px 0;border-bottom:1px solid rgba(90,140,220,.09);font-size:13px"><span class="li-code">${esc(r.code)}</span><span class="badge ${stClass(r.status)}" style="margin-left:8px">${t(ST_KEY[r.status])}</span><div style="color:var(--muted);font-size:12px;margin-top:4px">${r.anonymous?'🕶️':esc(r.class_name||'-')} · ${new Date(r.created_at).toLocaleString()}</div></div>`).join('') : `<div style="color:var(--dim);font-size:13px">${t('noReports')}</div>`}</div>`;
}
async function viewStudents(){
  if(state.user.role !== 'admin'){ $('appmain').innerHTML = `<div class="empty"><span class="ic">🔒</span>Admin only</div>`; return; }
  const users = await fetchStudents();
  $('appmain').innerHTML = `<h1 class="page-title">${t('studentsTitle')}</h1><p class="page-sub">${t('studentsSub')}</p>${users.length ? `<div class="table-wrap"><table><thead><tr><th>${t('colName')}</th><th>${t('colEmail')}</th><th>${t('colClass')}</th><th>${t('colDate')}</th></tr></thead><tbody>${users.map(u=>`<tr><td style="font-weight:700;color:#e8f1ff">${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.class_name||'—')}</td><td style="color:var(--dim);font-size:12px">${new Date(u.created_at).toLocaleDateString()}</td></tr>`).join('')}</tbody></table></div>` : emptyBox('👥', t('noStudents'))}`;
}
async function viewTeacherReports(){
  const rs = await fetchAllReports();
  $('appmain').innerHTML = `<h1 class="page-title">${t('reportsTitle')}</h1><p class="page-sub">${t('reportsSub')}</p>${rs.length ? rs.map(reportCard).join('') : emptyBox('📋', t('noReports'))}`;
  bindReportCards();
}
async function viewAssess(){
  const as = await fetchAssessments();
  $('appmain').innerHTML = `<h1 class="page-title">${t('assessTitle')}</h1><p class="page-sub">${t('assessSub')}</p>${as.length ? `<div class="table-wrap"><table><thead><tr><th>${t('colName')}</th><th>${t('colClass')}</th><th>${t('colScore')}</th><th>${t('colLevel')}</th><th>${t('colDate')}</th></tr></thead><tbody>${as.map(a=>{ const col = a.level==='very_low'?'#66e29a':a.level==='low'?'#8fd67a':a.level==='mid'?'#7fb0ff':a.level==='high'?'#ffc76b':'#ff8fa3'; return `<tr><td style="font-weight:700;color:#e8f1ff">${esc(a.student_name)}</td><td>${esc(a.class_name||'—')}</td><td style="font-weight:800;color:${col}">${a.total}/60</td><td><span style="color:${col};font-weight:700;font-size:12.5px">${esc(a.label)}</span></td><td style="color:var(--dim);font-size:12px">${new Date(a.created_at).toLocaleString()}</td></tr>`; }).join('')}</tbody></table></div>` : emptyBox('🧠', t('noAssess'))}`;
}

async function viewRatings(){
  if(state.user.role !== 'teacher' && state.user.role !== 'admin'){
    $('appmain').innerHTML = `<div class="empty"><span class="ic">🔒</span>Teacher/Admin only</div>`; return;
  }
  const my = await fetchRatings();
  const today = new Date().toISOString().slice(0,10);
  const myClasses = state.user.classes || (state.user.className ? [state.user.className] : ['-']);
  const history = my.filter(r=>r.teacher_id===state.user.id).slice(0,20);
  $('appmain').innerHTML = `
    <h1 class="page-title">${t('ratingsTitle')}</h1><p class="page-sub">${t('ratingsSub')}</p>
    <div class="card">
      <div class="field"><label>${t('classSec')}</label>
        <select id="rtClass">${myClasses.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>${t('rateAtmosphere')}</label><div class="stars" id="starsA">${[1,2,3,4,5].map(i=>`<span data-v="${i}">⭐</span>`).join('')}</div></div>
      <div class="field"><label>${t('rateAttitude')}</label><div class="stars" id="starsB">${[1,2,3,4,5].map(i=>`<span data-v="${i}">⭐</span>`).join('')}</div></div>
      <div class="field"><label>${t('rateNote')}</label><textarea id="rtNote" placeholder="…"></textarea></div>
      <div class="err" id="rtErr"></div>
      <button class="btn btn-primary" id="rtSave">${t('rateSave')}</button>
    </div>
    <div class="card">
      <h3>${t('rateHistory')}</h3>
      ${history.length ? history.map(r=>`<div style="padding:10px 0;border-bottom:1px solid rgba(90,140,220,.09);font-size:13px"><div style="font-weight:700">${esc(r.class_name)} · ${r.rating_date}</div><div style="color:var(--muted);font-size:12px">${t('rateAtmosphere')}: ${r.atmosphere}/5 · ${t('rateAttitude')}: ${r.attitude}/5</div>${r.note?`<div style="color:#c3d4ec;font-size:12.5px;margin-top:4px">${esc(r.note)}</div>`:''}</div>`).join('') : `<div style="color:var(--dim);font-size:13px">—</div>`}
    </div>`;
  let av = 0, bv = 0;
  document.querySelectorAll('#starsA span').forEach(s=>s.onclick=()=>{ av = +s.dataset.v; document.querySelectorAll('#starsA span').forEach(x=>x.classList.toggle('on', +x.dataset.v <= av)); });
  document.querySelectorAll('#starsB span').forEach(s=>s.onclick=()=>{ bv = +s.dataset.v; document.querySelectorAll('#starsB span').forEach(x=>x.classList.toggle('on', +x.dataset.v <= bv)); });
  $('rtSave').onclick = async ()=>{
    if(!av || !bv){ $('rtErr').textContent = '—'; return; }
    const cls = $('rtClass').value;
    const note = $('rtNote').value.trim();
    const { error } = await sb.from('daily_ratings').insert({teacher_id: state.user.id, teacher_name: state.user.name, class_name: cls, atmosphere: av, attitude: bv, note: note || null});
    if(error){ $('rtErr').textContent = error.message; return; }
    alert('✓');
    renderApp();
  };
}

async function viewTeachers(){
  if(state.user.role !== 'admin'){ $('appmain').innerHTML = `<div class="empty"><span class="ic">🔒</span>Admin only</div>`; return; }
  const apps = await fetchApplications();
  $('appmain').innerHTML = `
    <h1 class="page-title">${t('teachersTitle')}</h1><p class="page-sub">${t('teachersSub')}</p>
    ${apps.length ? apps.map(a=>`
      <div class="list-item" style="cursor:default">
        <div class="li-head">
          <div><div style="font-weight:800;font-size:15px">${esc(a.name)}</div><div style="font-size:12px;color:var(--muted)">${esc(a.email)}</div></div>
          <span class="badge ${a.status==='approved'?'approved':a.status==='rejected'?'rejected':a.status==='blocked'?'blocked':'pending'}">${a.status}</span>
        </div>
        <div class="li-meta"><span>🕒 ${new Date(a.created_at).toLocaleString()}</span></div>
        ${a.status==='pending' ? `<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          <button class="btn btn-primary btn-sm" onclick="approveTeacher('${a.id}','${a.user_id}')">${t('approve')}</button>
          <button class="btn btn-danger btn-sm" onclick="rejectTeacher('${a.id}')">${t('reject')}</button>
          <button class="btn btn-ghost btn-sm" onclick="blockTeacher('${a.id}')">${t('block')}</button>
        </div>` : a.status==='blocked' || a.status==='rejected' ? `<div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-ghost btn-sm" onclick="unblockTeacher('${a.id}')">${t('unblock')}</button></div>` : ''}
      </div>`).join('') : emptyBox('👨‍🏫', '—')}`;
}
async function approveTeacher(appId, userId){
  await sb.from('teacher_applications').update({status:'approved', reviewed_at:new Date().toISOString(), reviewed_by: state.user.name}).eq('id', appId);
  await sb.from('profiles').update({role:'teacher'}).eq('id', userId);
  renderApp();
}
async function rejectTeacher(appId){
  const r = prompt(t('rejectReason')) || '';
  await sb.from('teacher_applications').update({status:'rejected', reject_reason: r, reviewed_at:new Date().toISOString(), reviewed_by: state.user.name}).eq('id', appId);
  renderApp();
}
async function blockTeacher(appId){
  await sb.from('teacher_applications').update({status:'blocked', reviewed_at:new Date().toISOString(), reviewed_by: state.user.name}).eq('id', appId);
  renderApp();
}
async function unblockTeacher(appId){
  await sb.from('teacher_applications').update({status:'pending', reviewed_at:null}).eq('id', appId);
  renderApp();
}

async function viewInbox(){
  const msgs = await fetchMessages();
  const receipts = await fetchReceipts();
  const receiptMap = {};
  receipts.forEach(r => receiptMap[r.message_id] = r);
  const myClass = state.user.className || '';
  const visible = msgs.filter(m=>{
    if(m.target_type === 'all') return true;
    if(m.target_type === 'teachers' && (state.user.role==='teacher' || state.user.role==='admin')) return true;
    if(m.target_type === 'students' && state.user.role==='student') return true;
    if(m.target_type === 'class' && myClass && m.target_value === myClass) return true;
    if(m.target_type === 'user' && m.target_value === state.user.id) return true;
    return false;
  });
  $('appmain').innerHTML = `
    <h1 class="page-title">${t('inboxTitle')}</h1><p class="page-sub">${t('inboxSub')}</p>
    ${visible.length ? visible.map(m=>{
      const rc = receiptMap[m.id];
      const unread = !rc || !rc.read_at;
      const liked = rc && rc.liked_at;
      return `<div class="msg-card ${unread?'unread':''}" onclick="openMessage('${m.id}')">
        <div class="title">${esc(m.title)}</div>
        <div class="meta"><span>👤 ${esc(m.sender_name||'Admin')}</span><span>🕒 ${new Date(m.created_at).toLocaleString()}</span></div>
        <div class="preview">${esc((m.body||'').slice(0,140))}</div>
        <div style="margin-top:10px"><button class="like-btn ${liked?'on':''}" onclick="event.stopPropagation();likeMessage('${m.id}')">❤️ ${t('likedBy')}</button></div>
      </div>`;
    }).join('') : emptyBox('📥','—')}`;
}
async function openMessage(id){
  const {data:m} = await sb.from('messages').select('*').eq('id', id).single();
  if(!m) return;
  const {data:rc} = await sb.from('message_receipts').select('*').eq('message_id', id).eq('user_id', state.user.id).maybeSingle();
  if(!rc) await sb.from('message_receipts').insert({message_id: id, user_id: state.user.id, read_at: new Date().toISOString()});
  else if(!rc.read_at) await sb.from('message_receipts').update({read_at: new Date().toISOString()}).eq('id', rc.id);
  await refreshUnread();
  const media = m.media_url ? (m.media_type==='video'?`<video src="${m.media_url}" controls style="width:100%;border-radius:12px;margin-top:12px"></video>`:m.media_type==='image'?`<img src="${m.media_url}" style="width:100%;border-radius:12px;margin-top:12px">`:`<a href="${m.media_url}" target="_blank" style="color:var(--accent2)">附件</a>`) : '';
  openModal(`<h2>${esc(m.title)}</h2><div style="font-size:12px;color:var(--muted);margin:6px 0 14px">👤 ${esc(m.sender_name||'Admin')} · ${new Date(m.created_at).toLocaleString()}</div><div style="font-size:14px;color:#c3d4ec;white-space:pre-wrap;line-height:1.7">${esc(m.body||'')}</div>${media}<div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn btn-ghost" onclick="closeModal()">${t('close')}</button></div>`);
}
async function likeMessage(id){
  const {data:rc} = await sb.from('message_receipts').select('*').eq('message_id', id).eq('user_id', state.user.id).maybeSingle();
  if(rc){
    await sb.from('message_receipts').update({liked_at: rc.liked_at ? null : new Date().toISOString()}).eq('id', rc.id);
  } else {
    await sb.from('message_receipts').insert({message_id: id, user_id: state.user.id, liked_at: new Date().toISOString()});
  }
  renderApp();
}

async function viewSend(){
  if(state.user.role !== 'admin'){ $('appmain').innerHTML = `<div class="empty"><span class="ic">🔒</span>Admin only</div>`; return; }
  $('appmain').innerHTML = `
    <h1 class="page-title">${t('composeTitle')}</h1><p class="page-sub">${t('composeSub')}</p>
    <div class="card">
      <div class="field"><label>${t('mTitle')}</label><input id="mTitle" placeholder="…"></div>
      <div class="field"><label>${t('mBody')}</label><textarea id="mBody" placeholder="…"></textarea></div>
      <div class="field"><label>${t('mTarget')}</label>
        <select id="mTarget">
          <option value="all">${t('mAll')}</option>
          <option value="teachers">${t('mTeachers')}</option>
          <option value="students">${t('mStudents')}</option>
          <option value="class">${t('mClass')}</option>
        </select>
      </div>
      <div class="field" id="mClassField" style="display:none"><label>${t('mClass')}</label><input id="mClass" placeholder="${t('mClassPh')}"></div>
      <div class="field"><label>${t('mMedia')}</label><input type="file" id="mMedia" accept="image/*,video/*" style="padding:8px;border-radius:12px;background:rgba(8,18,38,.85);border:1px solid var(--line);color:var(--text)"></div>
      <div class="err" id="mErr"></div>
      <button class="btn btn-primary" id="mBtn">${t('mSend')}</button>
    </div>`;
  $('mTarget').onchange = ()=>{ $('mClassField').style.display = $('mTarget').value === 'class' ? 'block' : 'none'; };
  $('mBtn').onclick = async ()=>{
    const title = $('mTitle').value.trim(); const body = $('mBody').value.trim();
    if(!title){ $('mErr').textContent = t('errFill'); return; }
    const target = $('mTarget').value; const tv = target==='class' ? $('mClass').value.trim() : null;
    let media_type = 'none', media_url = null;
    const f = $('mMedia').files[0];
    if(f){
      const path = Date.now() + '_' + f.name;
      const {data:up} = await sb.storage.from('message-media').upload(path, f);
      if(up){
        const {data:pub} = sb.storage.from('message-media').getPublicUrl(path);
        media_type = f.type.startsWith('video')?'video':f.type.startsWith('image')?'image':'file';
        media_url = pub.publicUrl;
      }
    }
    const {data:m, error} = await sb.from('messages').insert({sender_id: state.user.id, sender_name: state.user.name, title, body, target_type: target, target_value: tv, media_type, media_url}).select().single();
    if(error){ $('mErr').textContent = error.message; return; }
    const {data:users} = await sb.from('profiles').select('id, role, class_name');
    const targetUsers = (users||[]).filter(u=>{
      if(target === 'all') return true;
      if(target === 'teachers') return u.role === 'teacher';
      if(target === 'students') return u.role === 'student';
      if(target === 'class') return u.class_name === tv;
      return false;
    });
    if(targetUsers.length){
      await sb.from('message_receipts').insert(targetUsers.map(u=>({message_id: m.id, user_id: u.id})));
    }
    alert(t('sentOk'));
    renderApp();
  };
}

function openModal(html){ $('modalBox').innerHTML = `<button class="icon-btn modal-close" onclick="closeModal()">✕</button>` + html; $('modal').classList.add('on'); }
function closeModal(){ $('modal').classList.remove('on'); }
$('modal').addEventListener('click', e=>{ if(e.target===$('modal')) closeModal(); });

async function boot(){
  state.verify = newVerify();
  const splashDelay = new Promise(r=>setTimeout(r, 1600));
  const sessionCheck = (async()=>{ const {data:{session}} = await sb.auth.getSession(); if(!session) return null; const {data:prof} = await sb.from('profiles').select('*').eq('id', session.user.id).single(); return prof; })();
  const [, prof] = await Promise.all([splashDelay, sessionCheck]);
  if(prof){
    state.user = {id:prof.id, name:prof.name, email:prof.email, role:prof.role, className:prof.class_name, classes:prof.classes || []};
    await refreshUnread();
    if(!localStorage.getItem('vs_lang_picked')) showLangPicker(); else await enterApp();
  } else { showScreen('auth'); renderAuth(); }
}
boot();
</script>
